<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QEVR</title>
<meta name="description" content="O QEVR NASCEU DAS PISTAS E PERTENCE ÀS PISTAS.">
<meta name="theme-color" content="#09090B">
<meta property="og:title" content="QEVR">
<meta property="og:description" content="O QEVR NASCEU DAS PISTAS E PERTENCE ÀS PISTAS.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://qevr.party/assets/favicon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<div class="thermo" id="thermo" aria-hidden="true"><div class="thermo__fill" id="thermoFill"></div></div>

<header class="bar">
  <div class="bar__in">
    <a class="bar__mark" href="#topo" aria-label="QEVR"><canvas data-cells="QEVR" data-fit="108"></canvas></a>
    <nav class="bar__nav">
      <a href="#manifesto" aria-current="page" id="barManifesto">O MANIFESTO</a>
      <a href="studio/" id="barStudio">O ESTÚDIO</a>
    </nav>
    <div class="bar__lang" role="group" aria-label="PT / EN">
      <button id="langPt" type="button" aria-pressed="true">PT</button>
      <button id="langEn" type="button" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<main>
  <section class="arrival" id="topo">
    <div class="arrival__mascot" id="arrivalSlot">
      <div class="arrival__hint" id="mascotHint"></div>
      <button class="mascot" id="mascotBtn" aria-label="QEVR"><canvas id="mascotCanvas"></canvas></button>
    </div>
    <div class="arrival__color" id="arrivalColor">
      <div class="arrival__question" id="arrivalColorQuestion"></div>
      <div class="arrival__color-controls" role="group" aria-labelledby="arrivalColorQuestion">
        <button class="ctl ctl--swatch ctl--green" id="arrivalGreen" type="button" aria-pressed="true"><i></i><span>VERDE</span></button>
        <button class="ctl ctl--swatch ctl--pink" id="arrivalPink" type="button" aria-pressed="false"><i></i><span>ROSA</span></button>
      </div>
    </div>
  </section>

  <section class="blocks">
    <div class="block" id="manifesto" data-open="true">
      <button class="heading heading--toggle" aria-expanded="true" aria-controls="mundoBody">
        <span class="heading__text">
          <canvas data-cells="A PISTA" data-fit="470"></canvas>
          <span class="heading__sub" data-sub="world"></span>
        </span>
        <span class="heading__mark"></span>
      </button>
      <div class="block__body" id="mundoBody">
        <div class="copy" id="worldCopy"></div>
      </div>
    </div>

    <div class="block" id="pessoas" data-open="false">
      <button class="heading heading--toggle" aria-expanded="false" aria-controls="peopleBody">
        <span class="heading__text">
          <canvas data-cells="AS PESSOAS" data-fit="470"></canvas>
          <span class="heading__sub" data-sub="people"></span>
        </span>
        <span class="heading__mark"></span>
      </button>
      <div class="block__body" id="peopleBody">
        <div class="copy" id="peopleIntro"></div>
        <div class="people__grid" id="peopleList"></div>
        <div class="world__close" id="worldClose"></div>
      </div>
    </div>

    <div class="block" id="stances" data-open="false">
      <button class="heading heading--toggle" aria-expanded="false" aria-controls="stancesGrid">
        <span class="heading__text">
          <canvas data-cells="O QEVR" data-fit="470"></canvas>
          <span class="heading__sub" data-sub="stances"></span>
        </span>
        <span class="heading__mark"></span>
      </button>
      <div class="block__body"><div class="stances__grid" id="stancesGrid"></div></div>
    </div>

    <div class="block" id="regras" data-open="false">
      <button class="heading heading--toggle" aria-expanded="false" aria-controls="neversList">
        <span class="heading__text">
          <canvas data-cells="AS REGRAS" data-fit="470"></canvas>
          <span class="heading__sub" data-sub="nevers"></span>
        </span>
        <span class="heading__mark"></span>
      </button>
      <div class="block__body"><div class="stances__grid" id="neversList"></div></div>
    </div>

    <div class="block" id="presente" data-open="false">
      <button class="heading heading--toggle" aria-expanded="false" aria-controls="giftBody">
        <span class="heading__text">
          <canvas data-cells="UM PRESENTE" data-fit="470"></canvas>
          <span class="heading__sub" data-sub="gift"></span>
        </span>
        <span class="heading__mark"></span>
      </button>
      <div class="block__body">
        <div class="copy gift" id="giftBody"></div>
        <div class="stamp" id="stamp"></div>
      </div>
    </div>

    <a class="door door--exit" id="studioDoor" href="studio/"></a>
  </section>
</main>

<div class="companion" id="companionSlot" aria-hidden="true"></div>

<script src="assets/pixelfont.js"></script>
<script src="assets/qevr.js"></script>
<script src="assets/cascade.js"></script>
<script>
(function () {
  "use strict";

  var MODE_KEY = "qevr.mode";
  var TIME_AWARE = false;
  var h = new Date().getHours();
  var auto = TIME_AWARE ? ((h >= 23 || h < 7) ? "party" : (h === 7 ? "dawn" : "day")) : "day";
  var forced = (location.search.match(/[?&]mode=(day|party|dawn)(?:&|$)/) || [])[1];
  function readModePreference() {
    try {
      var mode = localStorage.getItem(MODE_KEY);
      return mode === "day" || mode === "party" ? mode : null;
    } catch (e) { return null; }
  }
  function writeModePreference(mode) {
    if (mode !== "day" && mode !== "party") return;
    try { localStorage.setItem(MODE_KEY, mode); } catch (e) {}
  }
  var stored = readModePreference();
  document.documentElement.setAttribute("data-mode", forced || stored || auto);

  /* the language works like the colour: a preference that sticks, a ?lang=
     preview that doesn't, and switching rooms runs the same QR cascade */
  var LANG_KEY = "qevr.lang";
  function readLang() {
    var forcedLang = (location.search.match(/[?&]lang=(pt|en)(?:&|$)/) || [])[1];
    if (forcedLang) return forcedLang;
    try { var l = localStorage.getItem(LANG_KEY); if (l === "pt" || l === "en") return l; } catch (e) {}
    return "pt";
  }
  var LANG = readLang();
  document.documentElement.lang = LANG === "en" ? "en" : "pt-BR";
  function chooseLang(next) {
    if (next === LANG) return;
    try { localStorage.setItem(LANG_KEY, next); } catch (e) {}
    window.QevrCascade.through(function () {
      if (location.search || location.hash) location.href = location.pathname;
      else location.reload();
    });
  }
  function syncLangBoxes() {
    document.getElementById("langPt").setAttribute("aria-pressed", String(LANG === "pt"));
    document.getElementById("langEn").setAttribute("aria-pressed", String(LANG === "en"));
  }
  syncLangBoxes();
  document.getElementById("langPt").addEventListener("click", function () { chooseLang("pt"); });
  document.getElementById("langEn").addEventListener("click", function () { chooseLang("en"); });

  function cssVar(n, fb) {
    return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || fb;
  }
  function brandColor() { return cssVar("--brand", "#CCFF00"); }
  function mutedColor() { return cssVar("--qevr-muted", "#9A9AA5"); }

  /* ---------- headings drawn from the mascot's own cells ---------- */
  function drawCells(canvas) {
    var text = canvas.getAttribute("data-cells");
    var m = window.QevrType.textMatrix(text);
    var fitMax = parseFloat(canvas.getAttribute("data-fit"));
    var host = canvas.parentElement;
    var room = host.clientWidth || window.innerWidth;
    var avail = Math.min(room, fitMax || 400);
    var forced = parseFloat(canvas.getAttribute("data-force-cell"));
    var cell = forced ? forced : Math.max(2, Math.floor(avail / m.w));
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = m.w * cell * dpr;
    canvas.height = m.h * cell * dpr;
    canvas.style.width = (m.w * cell) + "px";
    canvas.style.height = (m.h * cell) + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, m.w * cell, m.h * cell);
    ctx.fillStyle = canvas.getAttribute("data-dim") ? mutedColor() : brandColor();
    for (var y = 0; y < m.h; y++) {
      for (var x = 0; x < m.w; x++) {
        if (m.cells[y * m.w + x]) ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }
    canvas.setAttribute("role", "img");
    canvas.setAttribute("aria-label", text);
  }
  function drawAllCells() { [].forEach.call(document.querySelectorAll("canvas[data-cells]"), drawCells); }

  var COPY = null, mascot = null;

  function syncArrivalColor() {
    var party = document.documentElement.getAttribute("data-mode") === "party";
    document.getElementById("arrivalGreen").setAttribute("aria-pressed", String(!party));
    document.getElementById("arrivalPink").setAttribute("aria-pressed", String(party));
  }

  function repaintBrand() {
    drawAllCells();
    if (mascot) mascot.paint();
  }

  /* picking a colour is a room change: it runs the same QR cascade as the doors */
  function chooseColor(mode) {
    if (document.documentElement.getAttribute("data-mode") === mode) return;
    window.QevrCascade.through(function () {
      document.documentElement.setAttribute("data-mode", mode);
      writeModePreference(mode);
      syncArrivalColor();
      repaintBrand();
    });
  }

  syncArrivalColor();
  document.getElementById("arrivalGreen").addEventListener("click", function () { chooseColor("day"); });
  document.getElementById("arrivalPink").addEventListener("click", function () { chooseColor("party"); });

  function para(text, cls) {
    var p = document.createElement("p");
    if (cls) p.className = cls;
    p.textContent = text;
    return p;
  }

  /* titles come from the copy deck, and every label says what sits behind it */
  function syncTitles() {
    var map = [
      ["#manifesto", COPY.world],
      ["#pessoas", COPY.people],
      ["#stances", COPY.stances],
      ["#regras", COPY.nevers],
      ["#presente", COPY.gift]
    ];
    map.forEach(function (pair) {
      var c = document.querySelector(pair[0] + " .heading--toggle canvas");
      if (c && pair[1].title) c.setAttribute("data-cells", pair[1].title);
      var s = document.querySelector(pair[0] + " .heading__sub");
      if (s && pair[1].sub) s.textContent = pair[1].sub;
    });
  }

  /* one block open at a time. opening is not a page change, so no glitch. */
  function setOpen(box) {
    [].forEach.call(document.querySelectorAll(".block"), function (b) {
      var open = box === b;
      b.setAttribute("data-open", open ? "true" : "false");
      var btn = b.querySelector(".heading--toggle");
      if (btn) btn.setAttribute("aria-expanded", open ? "true" : "false");
    });
  }

  /* every move runs the QR cascade, the same entrance the app uses for his chat */
  function wireCascade() {
    window.QevrCascade.wireLinks(".bar__nav a, .door[href='studio/']");
    [].forEach.call(document.querySelectorAll("a[href^='#']"), function (a) {
      a.addEventListener("click", function (e) {
        var id = a.getAttribute("href").slice(1);
        var target = id && document.getElementById(id);
        if (!target) return;
        e.preventDefault();
        window.QevrCascade.through(function () {
          /* landing on a block also opens it */
          if (target.classList.contains("block")) setOpen(target);
          target.scrollIntoView({ behavior: "auto", block: "start" });
        });
      });
    });
  }

  function wireToggles() {
    [].forEach.call(document.querySelectorAll(".block"), function (box) {
      var btn = box.querySelector(".heading--toggle");
      if (!btn) return;
      btn.addEventListener("click", function () {
        var open = box.getAttribute("data-open") === "true";
        if (open) {
          box.setAttribute("data-open", "false");
          btn.setAttribute("aria-expanded", "false");
        } else {
          setOpen(box);
          /* keep the heading you tapped where your finger is */
          var r = box.getBoundingClientRect();
          var bar = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--bar")) || 52;
          if (r.top < bar) box.scrollIntoView({ behavior: "auto", block: "start" });
        }
      });
    });
  }

  /* all four headings render at one shared cell size, so they match */
  function unifyToggleHeadings() {
    var cs = document.querySelectorAll(".heading--toggle canvas");
    if (!cs.length) return;
    var minCell = Infinity;
    [].forEach.call(cs, function (c) {
      var m = window.QevrType.textMatrix(c.getAttribute("data-cells"));
      var room = c.parentElement.clientWidth || window.innerWidth;
      var fit = parseFloat(c.getAttribute("data-fit")) || 470;
      minCell = Math.min(minCell, Math.max(2, Math.floor(Math.min(room, fit) / m.w)));
    });
    [].forEach.call(cs, function (c) { c.setAttribute("data-force-cell", minCell); drawCells(c); });
  }

  /* the bar and the one exit door read their words from the deck, like everything */
  function buildDoors() {
    document.getElementById("barManifesto").textContent = COPY.doors.manifesto.label;
    document.getElementById("barStudio").textContent = COPY.doors.studio.label;
    var exit = document.getElementById("studioDoor");
    exit.innerHTML = "";
    var s = document.createElement("strong"); s.textContent = COPY.doors.studio.label; exit.appendChild(s);
    /* the door can stand on its label alone: no sub, no empty span */
    if (COPY.doors.studio.sub) {
      var t = document.createElement("span"); t.textContent = COPY.doors.studio.sub; exit.appendChild(t);
    }
  }

  function buildWorld() {
    var w = COPY.world;
    var host = document.getElementById("worldCopy");
    w.paragraphs.forEach(function (t, i) { host.appendChild(para(t, i >= w.paragraphs.length - 1 ? "dim" : "")); });
  }

  function buildPeople() {
    /* the people are a deck like any other list on this page: numbered tiles,
       same borders, same paddings. these stay open, they are the heart. */
    var intro = document.getElementById("peopleIntro");
    if (intro && COPY.people.intro) intro.appendChild(para(COPY.people.intro));
    var list = document.getElementById("peopleList");
    COPY.people.items.forEach(function (pair, i) {
      var row = document.createElement("div"); row.className = "stance stance--still";
      var idx = document.createElement("span");
      idx.className = "stance__idx";
      idx.textContent = "0" + (i + 1);
      row.appendChild(idx);
      var t = document.createElement("span"); t.className = "stance__head"; t.textContent = pair[0];
      var d = document.createElement("span"); d.className = "stance__body";
      d.appendChild(para(pair[1]));
      row.appendChild(t); row.appendChild(d); list.appendChild(row);
    });

    var close = document.getElementById("worldClose");
    COPY.people.close.forEach(function (t) { close.appendChild(para(t)); });
  }

  function buildTiles(grid, items) {
    items.forEach(function (item, i) {
      var b = document.createElement("button");
      b.className = "stance"; b.type = "button";
      b.setAttribute("aria-expanded", "false");
      var idx = document.createElement("span");
      idx.className = "stance__idx";
      idx.textContent = (i + 1 < 10 ? "0" : "") + (i + 1);
      b.appendChild(idx);
      var head = document.createElement("span");
      head.className = "stance__head"; head.textContent = item.head;
      b.appendChild(head);
      var body = document.createElement("span");
      body.className = "stance__body";
      item.body.forEach(function (t) { body.appendChild(para(t)); });
      b.appendChild(body);
      b.addEventListener("click", function () {
        var open = b.getAttribute("aria-expanded") === "true";
        [].forEach.call(grid.children, function (c) { c.setAttribute("aria-expanded", "false"); });
        b.setAttribute("aria-expanded", open ? "false" : "true");
        if (!open && mascot) {
          mascot.ignoredSince = Date.now();
          mascot.setFace(item.face);
          mascot.glitch();
        }
      });
      grid.appendChild(b);
    });
  }

  function buildStances() {
    buildTiles(document.getElementById("stancesGrid"), COPY.stances.items);
  }

  /* REGRAS reads exactly like O JEITO DELE: same tile, same behaviour */
  function buildNevers() {
    buildTiles(document.getElementById("neversList"), COPY.nevers.lines.map(function (pair) {
      return { head: pair[0], body: [pair[1]], face: COPY.nevers.face };
    }));
  }

  function buildGift() {
    var host = document.getElementById("giftBody");
    COPY.gift.paragraphs.forEach(function (t) { host.appendChild(para(t)); });
    /* the closing line is the last thing UM PRESENTE says, not a footer */
    var stamp = document.getElementById("stamp");
    stamp.innerHTML = "";
    var b = document.createElement("b"); b.textContent = COPY.stamp;
    stamp.appendChild(b);
    var hint = document.getElementById("mascotHint");
    if (hint && COPY.arrival) hint.textContent = COPY.arrival.mascotHint;
    var question = document.getElementById("arrivalColorQuestion");
    if (question && COPY.arrival) question.textContent = COPY.arrival.colorQuestion;
  }

  /* ---------- he starts life size, then takes his corner ---------- */
  var inCorner = false;
  function isSmall() { return window.matchMedia("(max-width: 720px)").matches; }
  function arrivalCellFor() {
    if (!isSmall()) {
      /* the arrival owns the whole first screen now: he scales with it */
      var byH = Math.floor((window.innerHeight * 0.52) / window.Qevr.CROP.h);
      return Math.max(14, Math.min(22, byH));
    }
    var arrival = document.getElementById("topo");
    var room = arrival && arrival.clientWidth ? arrival.clientWidth : window.innerWidth;
    var byWidth = Math.floor(Math.max(184, room - 40) / window.Qevr.CROP.w);
    var byHeight = Math.floor(Math.max(200, window.innerHeight * 0.42) / window.Qevr.CROP.h);
    return Math.max(8, Math.min(13, byWidth, byHeight));
  }
  function cellFor() { return inCorner ? (isSmall() ? 3 : 4) : arrivalCellFor(); }
  function boundsFor() {
    /* the corner zone is small on purpose: he wanders a little, never onto the copy */
    return inCorner ? { x: isSmall() ? 8 : 10, y: isSmall() ? 6 : 8 }
                    : { x: isSmall() ? 10 : 20, y: isSmall() ? 8 : 16 };
  }
  function placeMascot() {
    if (!mascot) return;
    var btn = document.getElementById("mascotBtn");
    var target = inCorner ? document.getElementById("companionSlot") : document.getElementById("arrivalSlot");
    if (btn.parentElement !== target) target.appendChild(btn);
    mascot.pos.x = 0; mascot.pos.y = 0; mascot.squash = 1;
    mascot.applyTransform();
    mascot.setCell(cellFor());
    mascot._bounds = boundsFor();
  }
  function checkCorner() {
    var arrival = document.getElementById("topo");
    if (!arrival) return;
    var b = arrival.getBoundingClientRect().bottom;
    var next = inCorner ? (b > 200 ? false : true) : (b < 90 ? true : false);
    if (next !== inCorner) { inCorner = next; placeMascot(); }
  }

  /* ---------- the thermometer replaces the scrollbar ---------- */
  var fill = document.getElementById("thermoFill");
  var thermo = document.getElementById("thermo");
  var wasFire = false;
  function onScroll() {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
    fill.style.height = (p * 100) + "%";
    var fire = p > 0.92;
    thermo.classList.toggle("is-fire", fire);
    if (fire && !wasFire && mascot) mascot.setFace(COPY ? COPY.gift.face : "Stars");
    wasFire = fire;
    checkCorner();
  }

  /* ---------- he reads it with you ---------- */
  function watchSections() {
    if (!("IntersectionObserver" in window)) return;
    var map = { manifesto: COPY.world.face, pessoas: COPY.people.face, stances: "Default", regras: COPY.nevers.face, presente: COPY.gift.face };
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting || !mascot || wasFire) return;
        var f = map[e.target.id];
        if (f) mascot.setFace(f);
      });
    }, { threshold: 0.4 });
    Object.keys(map).forEach(function (id) {
      var el = document.getElementById(id);
      if (el) io.observe(el);
    });
  }

  drawAllCells();

  Promise.all([
    fetch("assets/manifesto." + LANG + ".json").then(function (r) { return r.json(); }),
    window.Qevr.load("assets/qevr-expressions.json")
  ]).then(function (res) {
    COPY = res[0];
    if (COPY.ui) {
      document.querySelector("#arrivalGreen span").textContent = COPY.ui.green;
      document.querySelector("#arrivalPink span").textContent = COPY.ui.pink;
    }
    syncTitles();
    buildDoors(); buildWorld(); buildPeople(); buildStances(); buildNevers(); buildGift();
    drawAllCells();
    unifyToggleHeadings();
    wireCascade();
    wireToggles();
    onScroll();

    var btn = document.getElementById("mascotBtn");
    mascot = new window.Qevr.Mascot(document.getElementById("mascotCanvas"), {
      host: btn, cell: cellFor(), face: "Default"
    });
    btn.addEventListener("click", function () { mascot.poke(); });
    placeMascot();
    /* his entrance is scripted, always the same three: DEFAULT, then ANIME,
       then TE AMO (Kissing). only after that the brain takes over. reduced
       motion skips the show and goes straight to the still. */
    var reduceEntrance = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduceEntrance) {
      mascot.start(boundsFor());
    } else {
      setTimeout(function () { mascot.setFace("Anime"); }, 1300);
      setTimeout(function () { mascot.setFace("Kissing"); }, 2800);
      setTimeout(function () { mascot.start(boundsFor()); }, 4200);
    }

    /* he notices you. 60 percent of the time it was nothing. */
    window.addEventListener("pointermove", function (e) {
      var r = btn.getBoundingClientRect();
      var cx = r.left + r.width / 2;
      mascot._look = { x: Math.max(-10, Math.min(10, (e.clientX - cx) / 40)) };
    }, { passive: true });

    watchSections();

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () {
        drawAllCells(); unifyToggleHeadings(); placeMascot();
      });
    }
  }).catch(function (err) { console.error("[qevr] boot failed", err); });

  window.addEventListener("scroll", onScroll, { passive: true });
  var rt;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      [].forEach.call(document.querySelectorAll(".heading--toggle canvas"), function (c) { c.removeAttribute("data-force-cell"); });
      drawAllCells(); unifyToggleHeadings(); onScroll(); placeMascot();
    }, 150);
  });
})();
</script>
</body>
</html>
