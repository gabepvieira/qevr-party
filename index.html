<script src="assets/pixelfont.js"></script>
<script src="assets/qevr.js"></script>
<script src="assets/cascade.js"></script>
<script>
(function () {
  "use strict";

  var MODE_KEY = "qevr.mode";
  var forced = (location.search.match(/[?&]mode=(day|party)(?:&|$)/) || [])[1];
  function readModePreference() {
    try {
      var mode = localStorage.getItem(MODE_KEY);
      return mode === "day" || mode === "party" ? mode : null;
    } catch (e) { return null; }
  }
  function writeModePreference(mode) {
    if (mode !== "day" && mode !== "party") return;
    try { localStorage.setItem(MODE_KEY, mode); } catch (e) {}
  }
  document.documentElement.setAttribute("data-mode", forced || readModePreference() || "day");

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var canHover = window.matchMedia && window.matchMedia("(hover: hover)").matches;

  /* the language works like the colour: a preference that sticks, a ?lang=
     preview that doesn't, and switching rooms runs the same QR cascade */
  var LANG_KEY = "qevr.lang";
  function readLang() {
    var forcedLang = (location.search.match(/[?&]lang=(pt|en)(?:&|$)/) || [])[1];
    if (forcedLang) return forcedLang;
    try { var l = localStorage.getItem(LANG_KEY); if (l === "pt" || l === "en") return l; } catch (e) {}
    return "pt";
  }
  var LANG = readLang();
  document.documentElement.lang = LANG === "en" ? "en" : "pt-BR";
  function chooseLang(next) {
    if (next === LANG) return;
    try { localStorage.setItem(LANG_KEY, next); } catch (e) {}
    window.QevrCascade.through(function () {
      if (location.search || location.hash) location.href = location.pathname;
      else location.reload();
    });
  }
  document.getElementById("langPt").setAttribute("aria-pressed", String(LANG === "pt"));
  document.getElementById("langEn").setAttribute("aria-pressed", String(LANG === "en"));
  document.getElementById("langPt").addEventListener("click", function () { chooseLang("pt"); });
  document.getElementById("langEn").addEventListener("click", function () { chooseLang("en"); });

  function cssVar(n, fb) {
    return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || fb;
  }
  function brandColor() { return cssVar("--brand", "#CCFF00"); }
  function mutedColor() { return cssVar("--qevr-muted", "#9A9AA5"); }
  function inkColor() { return cssVar("--qevr-ink", "#09090B"); }

  /* ---------- headings drawn from the mascot's own cells.
     the type engine finally performs: closed headings render DIM, the open
     one is the only brand heading on screen, opening IGNITES it in chunks,
     and a touch makes it flinch one shear beat. ---------- */
  function drawCells(canvas, opts) {
    opts = opts || {};
    var text = canvas.getAttribute("data-cells");
    var m = window.QevrType.textMatrix(text);
    var fitMax = parseFloat(canvas.getAttribute("data-fit"));
    var host = canvas.parentElement;
    var room = host.clientWidth || window.innerWidth;
    var avail = Math.min(room, fitMax || 400);
    var forcedCell = parseFloat(canvas.getAttribute("data-force-cell"));
    var cell = forcedCell ? forcedCell : Math.max(2, Math.floor(avail / m.w));
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = m.w * cell * dpr;
    canvas.height = m.h * cell * dpr;
    canvas.style.width = (m.w * cell) + "px";
    canvas.style.height = (m.h * cell) + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, m.w * cell, m.h * cell);
    var dim = opts.dim != null ? opts.dim : canvas.hasAttribute("data-dim");
    ctx.fillStyle = opts.color || (dim ? mutedColor() : brandColor());
    for (var y = 0; y < m.h; y++) {
      var shear = opts.shear && opts.shear[y] ? opts.shear[y] : 0;
      for (var x = 0; x < m.w; x++) {
        var i = y * m.w + x;
        if (!m.cells[i]) continue;
        if (opts.mask) {
          ctx.fillStyle = opts.mask[i] ? brandColor() : mutedColor();
        }
        ctx.fillRect((x + shear) * cell, y * cell, cell, cell);
      }
    }
    canvas.setAttribute("role", "img");
    canvas.setAttribute("aria-label", text);
    canvas._matrix = m;
    canvas._cell = cell;
    return m;
  }
  function drawAllCells() {
    [].forEach.call(document.querySelectorAll("canvas[data-cells]"), function (c) {
      if (c.hasAttribute("data-doorword")) { drawDoorWord(c, false); return; }
      drawCells(c);
    });
    syncHeadingDim();
  }

  /* closed headings are the quiet ones; the open block carries the heat */
  function syncHeadingDim() {
    [].forEach.call(document.querySelectorAll(".block"), function (b) {
      var c = b.querySelector(".heading--toggle canvas");
      if (!c) return;
      var open = b.getAttribute("data-open") === "true";
      if (open) c.removeAttribute("data-dim"); else c.setAttribute("data-dim", "1");
      drawCells(c);
    });
  }

  /* the open heading IGNITES: cells flip muted to brand in random chunks */
  function ignite(canvas) {
    if (reduce) { drawCells(canvas); return; }
    var m = canvas._matrix || window.QevrType.textMatrix(canvas.getAttribute("data-cells"));
    var idx = [];
    for (var i = 0; i < m.cells.length; i++) if (m.cells[i]) idx.push(i);
    for (var j = idx.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var t = idx[j]; idx[j] = idx[k]; idx[k] = t;
    }
    var mask = new Uint8Array(m.cells.length);
    var frames = 5, per = Math.ceil(idx.length / frames), p = 0;
    (function step() {
      for (var n = 0; n < per && p < idx.length; n++, p++) mask[idx[p]] = 1;
      drawCells(canvas, { mask: mask });
      if (p < idx.length) setTimeout(step, 46);
      else drawCells(canvas);
    })();
  }

  /* one shear beat: a row band slips sideways for two frames and snaps back */
  function flinch(canvas) {
    if (reduce || canvas._flinching) return;
    canvas._flinching = true;
    var band = 2 + Math.floor(Math.random() * 5);
    var shear = {}; shear[band] = 1; shear[band + 1] = 1;
    drawCells(canvas, { shear: shear, dim: canvas.hasAttribute("data-dim") });
    setTimeout(function () {
      drawCells(canvas);
      canvas._flinching = false;
    }, 90);
  }

  var COPY = null, mascot = null;

  function syncArrivalColor() {
    var party = document.documentElement.getAttribute("data-mode") === "party";
    document.getElementById("arrivalGreen").setAttribute("aria-pressed", String(!party));
    document.getElementById("arrivalPink").setAttribute("aria-pressed", String(party));
  }

  function repaintBrand() {
    drawAllCells();
    paintStamp();
    if (mascot) mascot.paint();
  }

  /* ---------- L02: he molts FIRST, the page follows with one quick hit ----------
     picking a colour repaints HIS body cells in stepped chunks on his own canvas,
     and only when he finishes does the page take one fast jolt and follow. */
  var MODE_HEX = { day: "#CCFF00", party: "#FF007F" };
  function moltTo(mode) {
    if (document.documentElement.getAttribute("data-mode") === mode) return;
    if (!mascot || reduce) {
      document.documentElement.setAttribute("data-mode", mode);
      writeModePreference(mode);
      syncArrivalColor();
      repaintBrand();
      return;
    }
    mascot._busy = true;
    var target = MODE_HEX[mode];
    var ctx = mascot.canvas.getContext("2d");
    var C = window.Qevr.CROP, n = mascot.n, c = mascot.cell;
    var bodyIdx = [];
    for (var i = 0; i < mascot.render.length; i++) if (mascot.render[i] === 1) bodyIdx.push(i);
    for (var j = bodyIdx.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var t = bodyIdx[j]; bodyIdx[j] = bodyIdx[k]; bodyIdx[k] = t;
    }
    mascot.glitch();
    var frames = 5, per = Math.ceil(bodyIdx.length / frames), p = 0;
    function paintIdx(idx, color) {
      var y = Math.floor(idx / n), x = idx % n;
      var gy = y - C.y0, gx = x - C.x0;
      if (gy < 0 || gy >= C.h || gx < 0 || gx >= C.w) return;
      ctx.fillStyle = color;
      ctx.fillRect(gx * c, gy * c, c, c);
    }
    setTimeout(function step() {
      for (var m = 0; m < per && p < bodyIdx.length; m++, p++) paintIdx(bodyIdx[p], target);
      if (p < bodyIdx.length) { setTimeout(step, 55); return; }
      /* he finished. now the page takes one quick stepped hit and follows. */
      var main = document.getElementById("pageMain");
      main.classList.add("jolt");
      setTimeout(function () {
        document.documentElement.setAttribute("data-mode", mode);
        writeModePreference(mode);
        syncArrivalColor();
        repaintBrand();
        main.classList.remove("jolt");
        mascot._busy = false;
      }, 90);
    }, 180);
  }

  syncArrivalColor();
  document.getElementById("arrivalGreen").addEventListener("click", function () { moltTo("day"); });
  document.getElementById("arrivalPink").addEventListener("click", function () { moltTo("party"); });

  function para(text, cls) {
    var p = document.createElement("p");
    if (cls) p.className = cls;
    p.textContent = text;
    return p;
  }

  function syncTitles() {
    var map = [

  /* ---------- L08 + L09 + L13: tiles stay short; the opened body slides into a
     full-width bay under its row, at full volume, typing in hard chunks. ---------- */
  var bay = null, bayTimer = 0, bayGen = 0;
  function closeBay() {
    bayGen++;
    if (bayTimer) { clearTimeout(bayTimer); bayTimer = 0; }
    if (bay && bay.parentNode) bay.parentNode.removeChild(bay);
    bay = null;
    [].forEach.call(document.querySelectorAll(".stance[aria-expanded='true']"), function (t) {
      t.setAttribute("aria-expanded", "false");
    });
  }
  function rowEndOf(grid, tile) {
    var tiles = [].filter.call(grid.children, function (c) { return c.classList.contains("stance"); });
    var top = tile.offsetTop, last = tile;
    tiles.forEach(function (t) { if (t.offsetTop === top) last = t; });
    return last;
  }
  function openBay(grid, tile, idxText, paragraphs) {
    closeBay();
    var g = ++bayGen;
    tile.setAttribute("aria-expanded", "true");
    bay = document.createElement("div");
    bay.className = "stances__bay";
    var idx = document.createElement("span");
    idx.className = "stances__bay-idx"; idx.textContent = idxText;
    var copyHost = document.createElement("div");
    copyHost.className = "stances__bay-copy";
    bay.appendChild(idx); bay.appendChild(copyHost);
    var anchor = rowEndOf(grid, tile);
    if (anchor.nextSibling) grid.insertBefore(bay, anchor.nextSibling);
    else grid.appendChild(bay);

    /* reserve the final height first so nothing below jumps while it types */
    var ps = paragraphs.map(function (t) { return para(t); });
    ps.forEach(function (p) { copyHost.appendChild(p); });
    var fullH = copyHost.offsetHeight;
    copyHost.style.minHeight = fullH + "px";

    if (reduce) { dropFinalDot(copyHost); return; }

    /* type in 3-4 hard chunks, block cursor blinks twice and dies */
    var full = paragraphs.map(function (t) { return t; });
    ps.forEach(function (p) { p.textContent = ""; });
    var cursor = document.createElement("span");
    cursor.className = "cursor";
    var chunksPer = 4;
    var plan = [];
    full.forEach(function (t, pi) {
      var words = t.split(" ");
      var size = Math.max(1, Math.ceil(words.length / chunksPer));
      for (var i = 0; i < words.length; i += size) {
        plan.push({ p: pi, text: words.slice(0, i + size).join(" ") });
      }
    });
    var step = 0;
    (function type() {
      if (g !== bayGen) return;
      if (step < plan.length) {
        var item = plan[step++];
        ps[item.p].textContent = item.text;
        ps[item.p].appendChild(cursor);
        bayTimer = setTimeout(type, 80);
        return;
      }
      var blinks = 0;
      (function blink() {
        if (g !== bayGen) return;
        cursor.style.visibility = cursor.style.visibility === "hidden" ? "" : "hidden";
        blinks++;
        if (blinks < 4) { bayTimer = setTimeout(blink, 90); return; }
        if (cursor.parentNode) cursor.parentNode.removeChild(cursor);
        dropFinalDot(copyHost);
      })();
    })();
  }
  /* the final period lands, then only IT disappears */
  function dropFinalDot(copyHost) {
    var ps = copyHost.querySelectorAll("p");
    if (!ps.length) return;
    var last = ps[ps.length - 1];
    setTimeout(function () {
      var t = last.textContent;
      if (t && t.charAt(t.length - 1) === ".") last.textContent = t.slice(0, -1);
    }, 500);
  }

  /* ---------- AS REGRAS: the poster pop ---------- */
  var posterOpen = false;
  function buildPoster() {

  /* A09: the poster leaves the site print-ready. A4 proportion, pixel art
     survives print. a lambe from the scene, never an ad. */
  function downloadPoster() {
    var W = 1240, H = 1754;
    var canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = "#09090B"; ctx.fillRect(0, 0, W, H);
    var brand = brandColor();
    ctx.strokeStyle = brand; ctx.lineWidth = 12;
    ctx.strokeRect(36, 36, W - 72, H - 72);
    /* the title in his cells */
    var tm = window.QevrType.textMatrix(COPY.nevers.title);
    var tCell = Math.floor((W - 200) / tm.w);
    ctx.fillStyle = brand;
    for (var y = 0; y < tm.h; y++) for (var x = 0; x < tm.w; x++) {
      if (tm.cells[y * tm.w + x]) ctx.fillRect(100 + x * tCell, 90 + y * tCell, tCell, tCell);
    }
    /* him, mad, beside the rules */
    var m = window.Qevr.matrix(COPY.nevers.face || "Angry");
    var C = window.Qevr.CROP;
    var fCell = 14;
    var fx = W - 100 - C.w * fCell, fy = 320;
    for (y = 0; y < C.h; y++) for (x = 0; x < C.w; x++) {
      var v = m.cells[(y + C.y0) * m.n + (x + C.x0)];
      if (!v) continue;
      ctx.fillStyle = v === 2 ? "#09090B" : brand;
      ctx.fillRect(fx + x * fCell, fy + y * fCell, fCell, fCell);
    }
    /* the rules, verbatim from the deck */
    ctx.textAlign = "left";
    var ty = 360;
    COPY.nevers.lines.forEach(function (pair) {
      ctx.fillStyle = "#FFFFFF";
      ctx.font = "700 34px 'Space Mono', monospace";
      ctx.fillText(pair[0], 100, ty);
      ctx.fillStyle = "#9A9AA5";
      ctx.font = "22px 'Space Mono', monospace";
      ctx.fillText(pair[1], 100, ty + 36);
      ty += 120;
    });
    ctx.fillStyle = "#9A9AA5";
    ctx.font = "24px 'Space Mono', monospace";
    ctx.fillText(COPY.brand + " / " + COPY.city, 100, H - 100);
    var a = document.createElement("a");
    a.download = "qiqi-as-regras.png";
    a.href = canvas.toDataURL("image/png");
    document.body.appendChild(a); a.click(); a.remove();
  }
  function paintPosterArt() {
    var canvas = document.getElementById("posterArt");
    var m = window.Qevr.matrix(COPY.nevers.face || "Angry");
    if (!m) return;
    var C = window.Qevr.CROP;
    var cell = window.matchMedia("(max-width: 720px)").matches ? 6 : 9;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = C.w * cell * dpr; canvas.height = C.h * cell * dpr;
    canvas.style.width = (C.w * cell) + "px"; canvas.style.height = (C.h * cell) + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, C.w * cell, C.h * cell);
    for (var y = 0; y < C.h; y++) {
      for (var x = 0; x < C.w; x++) {
        var v = m.cells[(y + C.y0) * m.n + (x + C.x0)];
        if (!v) continue;
        ctx.fillStyle = v === 2 ? inkColor() : brandColor();
        ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }
  }
  function openPoster() {
    posterOpen = true;

  /* ---------- L15: the stamp drawn in his cells, the smiley in the brand ---------- */
  var stampShown = false;
  function paintStamp(mask) {
    var canvas = document.getElementById("stampCanvas");
    if (!canvas || !COPY) return;
    var text = COPY.stamp + " " + (COPY.stampSmiley || ":)");
    var m = window.QevrType.textMatrix(text);
    var host = canvas.parentElement;
    var room = (host.clientWidth || window.innerWidth) - 4;
    var cell = Math.max(3, Math.floor(Math.min(room, 900) / m.w));
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = m.w * cell * dpr; canvas.height = m.h * cell * dpr;
    canvas.style.width = (m.w * cell) + "px"; canvas.style.height = (m.h * cell) + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, m.w * cell, m.h * cell);
    /* the smiley is the last two glyphs: they wear the brand colour */
    var smileyM = window.QevrType.textMatrix((COPY.stampSmiley || ":)"));
    var smileyStart = m.w - smileyM.w;
    for (var y = 0; y < m.h; y++) {
      for (var x = 0; x < m.w; x++) {
        var i = y * m.w + x;
        if (!m.cells[i]) continue;
        if (mask && !mask[i]) continue;
        ctx.fillStyle = x >= smileyStart ? brandColor() : cssVar("--qevr-light", "#FFFFFF");
        ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }
    canvas.setAttribute("role", "img");
    canvas.setAttribute("aria-label", text);
    canvas._matrix = m;
  }
  function stampFirstOpen() {
    if (stampShown || reduce) { paintStamp(); stampShown = true; return; }
    stampShown = true;
    var canvas = document.getElementById("stampCanvas");
    paintStamp();
    var m = canvas._matrix;
    var idx = [];
    for (var i = 0; i < m.cells.length; i++) if (m.cells[i]) idx.push(i);
    for (var j = idx.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var t = idx[j]; idx[j] = idx[k]; idx[k] = t;
    }
    var mask = new Uint8Array(m.cells.length);
    var frames = 7, per = Math.ceil(idx.length / frames), p = 0;
    (function step() {
      for (var n = 0; n < per && p < idx.length; n++, p++) mask[idx[p]] = 1;
      paintStamp(mask);
      if (p < idx.length) setTimeout(step, 48);
      else paintStamp();
    })();
  }

  /* ---------- he starts life size, then takes his corner, and on desktop he
     JUMPS into the open block instead of hiding in it ---------- */
  var inCorner = false, jumpedBlock = null;
  function isSmall() { return window.matchMedia("(max-width: 720px)").matches; }
  function isDesktop() { return window.matchMedia("(min-width: 1101px)").matches; }
  function arrivalCellFor() {
    if (!isSmall()) {
      var byH = Math.floor((window.innerHeight * 0.52) / window.Qevr.CROP.h);
      return Math.max(14, Math.min(22, byH));
    }
    var arrival = document.getElementById("topo");
    var room = arrival && arrival.clientWidth ? arrival.clientWidth : window.innerWidth;
    var byWidth = Math.floor(Math.max(184, room - 40) / window.Qevr.CROP.w);
    var byHeight = Math.floor(Math.max(200, window.innerHeight * 0.42) / window.Qevr.CROP.h);
    return Math.max(8, Math.min(13, byWidth, byHeight));
  }
  function cellFor() {
    if (jumpedBlock) return 6;
    return inCorner ? (isSmall() ? 3 : 4) : arrivalCellFor();
  }
  function boundsFor() {
    if (jumpedBlock) return { x: 6, y: 5 };
    return inCorner ? { x: isSmall() ? 8 : 10, y: isSmall() ? 6 : 8 }
                    : { x: isSmall() ? 10 : 20, y: isSmall() ? 8 : 16 };
  }
  function openBlock() {
    return document.querySelector(".block[data-open='true']");
  }
  function syncJump() {
    var target = null;
    if (inCorner && isDesktop()) {
      var b = openBlock();
      if (b) target = b;
    }
    if (target !== jumpedBlock) {
      jumpedBlock = target;
      placeMascot();
      if (mascot && jumpedBlock) {
        var faceMap = { manifesto: COPY.world.face, pessoas: COPY.people.face, stances: "Default", regras: COPY.nevers.face, presente: COPY.gift.face };
        var f = faceMap[jumpedBlock.id];
        if (f) mascot.setFace(f);
        /* the hop in: a small squash beat so the arrival reads as a jump */
        mascot.squash = 0.84; mascot.applyTransform();
        setTimeout(function () { mascot.squash = 1; mascot.applyTransform(); }, 110);
      }
    }
  }
  function placeMascot() {
    if (!mascot) return;
    var btn = document.getElementById("mascotBtn");
    var target;
    if (jumpedBlock) target = jumpedBlock.querySelector(".block__field");
    else target = inCorner ? document.getElementById("companionSlot") : document.getElementById("arrivalSlot");
    if (btn.parentElement !== target) target.appendChild(btn);
    mascot.pos.x = 0; mascot.pos.y = 0; mascot.squash = 1;
    mascot.applyTransform();
    mascot.setCell(cellFor());
    mascot._bounds = boundsFor();
    document.body.classList.toggle("gutter", inCorner && isSmall());
  }
  function checkCorner() {
    var arrival = document.getElementById("topo");
    if (!arrival) return;
    var b = arrival.getBoundingClientRect().bottom;
    var next = inCorner ? (b > 200 ? false : true) : (b < 90 ? true : false);
    if (next !== inCorner) { inCorner = next; jumpedBlock = null; placeMascot(); syncJump(); }
  }

  /* ---------- L16: the thermometer counts cells ---------- */
  var fill = document.getElementById("thermoFill");
  var thermo = document.getElementById("thermo");
  var wasFire = false, fireFlipping = false;
  var THERMO_CELL = 14;
  function onScroll() {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
    var px = Math.floor((p * window.innerHeight) / THERMO_CELL) * THERMO_CELL;
    fill.style.height = px + "px";
    var fire = p > 0.92;
    if (fire && !wasFire) {
      if (mascot) mascot.setFace(COPY ? COPY.gift.face : "Stars");
      if (!reduce && !fireFlipping) {
        /* ON FIRE is an event: the strip flips in three hard frames */
        fireFlipping = true;
        var flips = 0;
        (function flip() {
          thermo.classList.toggle("is-fire");
          flips++;
          if (flips < 3) setTimeout(flip, 90);
          else { thermo.classList.add("is-fire"); fireFlipping = false; }
        })();
      } else {
        thermo.classList.add("is-fire");
      }
    }
    if (!fire && !fireFlipping) thermo.classList.remove("is-fire");
    wasFire = fire;
    checkCorner();
  }

  function watchSections() {
    if (!("IntersectionObserver" in window)) return;
    var map = { manifesto: COPY.world.face, pessoas: COPY.people.face, stances: "Default", regras: COPY.nevers.face, presente: COPY.gift.face };
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting || !mascot || wasFire || jumpedBlock) return;
        var f = map[e.target.id];
        if (f) mascot.setFace(f);
      });
    }, { threshold: 0.4 });
    Object.keys(map).forEach(function (id) {
      var el = document.getElementById(id);
      if (el) io.observe(el);
    });
  }

  /* ---------- A13: he keeps São Paulo hours, for the whole world ---------- */
  function spNow() {
    try {
      var parts = new Intl.DateTimeFormat("en-GB", { timeZone: "America/Sao_Paulo", hour: "2-digit", hourCycle: "h23", weekday: "short" }).formatToParts(new Date());
      var h = 12, wd = "";
      parts.forEach(function (p) { if (p.type === "hour") h = parseInt(p.value, 10); if (p.type === "weekday") wd = p.value; });
      return { hour: h, sunday: wd === "Sun" };
    } catch (e) { return { hour: new Date().getHours(), sunday: new Date().getDay() === 0 }; }
  }
  function hourFace() {
    var t = spNow();
    if (t.sunday && t.hour === 8) return "Dead";
    if (t.hour >= 13 && t.hour < 16) return "Eyes Closed";
    if (t.hour >= 8 && t.hour < 13) return "Bored";
    if (t.hour >= 16 && t.hour < 19) return "Content";
    if (t.hour >= 19 && t.hour < 23) return "Happy";
    if (t.hour >= 23 || t.hour < 5) return "Stars";
    return "Blissful";
  }

  /* ---------- L04: keep poking and he escalates, dies with an ERROR,
     breaks into the floor, and network-reloads back ---------- */
  var pokeCount = 0, pokeTimer = 0, laddering = false;
  function paintCustom(opts) {
    /* page-level painter over his canvas: rows can drop into the floor or
       only some rows render. engines are called, never edited. */
    var ctx = mascot.canvas.getContext("2d");
    var C = window.Qevr.CROP, n = mascot.n, c = mascot.cell;
    ctx.clearRect(0, 0, C.w * c, C.h * c);
    var body = brandColor(), ink = inkColor();
    for (var y = 0; y < n; y++) {
      var gy = y - C.y0;
      if (gy < 0 || gy >= C.h) continue;
      if (opts.visibleRows && opts.visibleRows.indexOf(gy) < 0) continue;
      var drop = opts.rowDrop ? Math.min(C.h - 1 - gy, Math.floor((C.h - 1 - gy) * opts.rowDrop)) : 0;
      var shear = opts.shear && opts.shear[y] ? opts.shear[y] : 0;
      for (var x = 0; x < n; x++) {
        var v = mascot.render[y * n + x];
        if (!v) continue;
        var sx = ((x + shear) % n + n) % n - C.x0;
        if (sx < 0 || sx >= C.w) continue;
        ctx.fillStyle = v === 2 ? ink : body;
        ctx.fillRect(sx * c, (gy + (C.h - 1 - gy) * (opts.rowDrop || 0)) * c > (C.h - 1) * c ? (C.h - 1) * c : (gy + drop) * c, c, c);
      }
    }
  }
  function ladderDie() {
    laddering = true;
    mascot._busy = true;
    var tag = document.getElementById("mascotTag");
    var load = document.getElementById("mascotLoad");
    tag.textContent = "ERRO";
    mascot.setFace("Dead", true);
    tag.classList.add("on");
    /* more violent glitch: two rounds back to back */
    mascot.glitch();
    setTimeout(function () { mascot.glitch(); }, 160);
    setTimeout(function () {
      tag.classList.remove("on");
      /* he breaks into the floor, row by row */
      var f = 0, frames = 8;
      (function collapse() {
        paintCustom({ rowDrop: f / frames });
        f++;
        if (f <= frames) { setTimeout(collapse, reduce ? 0 : 55); return; }
        /* gone. the network reloads him. */
        load.classList.add("on");
        var barFill = load.querySelector("i");
        var lp = 0;
        (function loadStep() {
          lp += 20;
          barFill.style.width = Math.min(100, lp) + "%";
          if (lp < 100) { setTimeout(loadStep, reduce ? 0 : 90); return; }
          load.classList.remove("on");
          barFill.style.width = "0";
          /* re-rez bottom-up */
          var C = window.Qevr.CROP;
          var shown = [];
          var row = C.h - 1;
          (function rerez() {
            for (var k = 0; k < 4 && row >= 0; k++, row--) shown.push(row);
            paintCustom({ visibleRows: shown });
            if (row >= 0) { setTimeout(rerez, reduce ? 0 : 55); return; }
            mascot.setFace("Default", true);
            mascot.paint();
            mascot._busy = false;
            laddering = false;
            pokeCount = 0;
          })();
        })();
      })();
    }, 420);
  }
  function pokeLadder() {
    if (laddering) return;
    pokeCount++;
    clearTimeout(pokeTimer);
    pokeTimer = setTimeout(function () { pokeCount = 0; }, 2200);
    if (pokeCount === 1) { mascot.poke(); return; }
    if (pokeCount === 2) { mascot.glitch(); return; }
    if (pokeCount === 3) { mascot.rowwave(); return; }
    ladderDie();
  }

  /* ---------- A08: hold him ~2s and the secret room opens ---------- */
  var holdTimer = 0, holdStart = 0, holdFired = false, holdRaf = 0;
  function wireHold(btn) {
    var charge = document.getElementById("mascotCharge");
    var chargeFill = charge.querySelector("i");
    function cancelHold() {
      if (holdRaf) cancelAnimationFrame(holdRaf);
      holdRaf = 0;
      charge.classList.remove("on");
      chargeFill.style.width = "0";
    }
    btn.addEventListener("pointerdown", function (e) {
      if (laddering) return;
      holdStart = performance.now();
      holdFired = false;
      (function tick(now) {
        var t = (now || performance.now()) - holdStart;
        if (t > 350) {
          charge.classList.add("on");
          chargeFill.style.width = Math.min(100, ((t - 350) / 1650) * 100) + "%";
          if (t > 700 && mascot && mascot.face.name !== "Anime") mascot.setFace("Anime");
        }
        if (t >= 2000) {
          holdFired = true;
          cancelHold();
          window.QevrCascade.leave("sala/");
          return;
        }
        holdRaf = requestAnimationFrame(tick);
      })();
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) {
      btn.addEventListener(ev, function () {
        var held = performance.now() - holdStart;
        cancelHold();
        if (mascot && held > 700 && !holdFired) mascot.setFace("Default");
      });
    });
    btn.addEventListener("click", function (e) {
      /* a long hold is the knock, not a poke */
      if (performance.now() - holdStart > 450) { e.preventDefault(); e.stopPropagation(); return; }
      pokeLadder();
    });
  }

  /* ---------- A15: the gift tag: the URL carries the dedication ---------- */
  function giftTag() {
    var m = location.search.match(/[?&]de=([^&]+)/);
    if (!m) return;
    var name;
    try { name = decodeURIComponent(m[1].replace(/\+/g, " ")); } catch (e) { return; }
    name = name.replace(/[^0-9A-Za-zÀ-ÖØ-öø-ÿ ]/g, "").trim().slice(0, 24);
    if (!name) return;
    var line = (COPY.arrival.fromPattern || "{NOME} TE DEU ISSO.").replace("{NOME}", name.toUpperCase());
    document.getElementById("arrivalFrom").textContent = line;
  }

  /* ---------- L25: the visible tab blinks, a hidden one never moves ---------- */
  function wireFavicon() {
    if (reduce) return;
    var link = document.getElementById("favicon32");
    if (!link) return;
    var orig = link.href;
    function frame(faceName) {
      var m = window.Qevr.matrix(faceName);
      if (!m) return null;
      var C = window.Qevr.CROP;
      var c = document.createElement("canvas");
      c.width = 32; c.height = 32;
      var ctx = c.getContext("2d");
      ctx.imageSmoothingEnabled = false;
      var cw = 32 / C.w, ch = 32 / C.h;
      for (var y = 0; y < C.h; y++) for (var x = 0; x < C.w; x++) {
        var v = m.cells[(y + C.y0) * m.n + (x + C.x0)];
        if (!v) continue;
        ctx.fillStyle = v === 2 ? "#09090B" : "#CCFF00";
        ctx.fillRect(Math.floor(x * cw), Math.floor(y * ch), Math.ceil(cw), Math.ceil(ch));
      }
      return c.toDataURL("image/png");
    }
    var closed = null;
    (function loop() {
      setTimeout(function () {
        if (!document.hidden) {
          if (closed === null) closed = frame("Eyes Closed");
          if (closed) {
            link.href = closed;
            setTimeout(function () { link.href = orig; }, 110);
          }
        }
        loop();
      }, 3200 + Math.random() * 2600);
    })();
  }

  /* ---------- L24: the console answers back ---------- */
  function consoleArt() {
    try {
      var m = window.Qevr.matrix("Default");
      var C = window.Qevr.CROP;
      var lines = [];
      for (var y = 0; y < C.h; y++) {
        var line = "";
        for (var x = 0; x < C.w; x++) {
          var v = m.cells[(y + C.y0) * m.n + (x + C.x0)];
          line += v === 1 ? "██" : (v === 2 ? "▓▓" : "  ");
        }
        lines.push(line);
      }
      console.log(lines.join("\n"));
      console.log((COPY ? COPY.stamp : "NOS VEMOS NA PISTA") + " " + (COPY ? COPY.stampSmiley : ":)"));
    } catch (e) {}
  }

  /* ---------- the scroll cue: a stepped arrow plus the word ---------- */
  function wireScrollCue() {
    document.getElementById("scrollWord").textContent = COPY.arrival.scrollLabel || "SCROLL";
    document.getElementById("arrivalCity").textContent = COPY.city;
    var cv = document.getElementById("scrollArrow");
    var ctx = cv.getContext("2d");
    var cells = [[2, 0], [2, 1], [0, 2], [1, 2], [2, 2], [3, 2], [4, 2], [1, 3], [2, 3], [3, 3], [2, 4]];
    var offset = 0;
    function draw() {
      ctx.clearRect(0, 0, 15, 15);
      ctx.fillStyle = mutedColor();
      cells.forEach(function (p) {
        var y = (p[1] + offset) % 5;
        ctx.fillRect(p[0] * 3, y * 3, 3, 3);
      });
    }
    draw();
    if (reduce) return;
    setInterval(function () { offset = (offset + 1) % 5; draw(); }, 420);
  }

  /* ---------- boot ---------- */
  drawAllCells();

  var inlineDeck = null;
  try { inlineDeck = JSON.parse(document.getElementById("deck-pt").textContent); } catch (e) {}

  var copyPromise = (LANG === "pt" && inlineDeck)
    ? Promise.resolve(inlineDeck)
    : fetch("assets/manifesto." + LANG + ".json").then(function (r) { return r.json(); });

  Promise.all([
    copyPromise,
    window.Qevr.load("assets/qevr-expressions.json")
  ]).then(function (res) {
    COPY = res[0];
    if (COPY.ui) {
      document.querySelector("#arrivalGreen span").textContent = COPY.ui.green;
      document.querySelector("#arrivalPink span").textContent = COPY.ui.pink;
    }
    syncTitles();
    buildDoors(); buildWorld(); buildPeople(); buildStances(); buildPoster(); buildGift();
    drawAllCells();
    unifyToggleHeadings();
    wireCascade();
    wireToggles();
    wireScrollCue();
    giftTag();
    paintStamp();
    onScroll();
    consoleArt();
    wireFavicon();

    var btn = document.getElementById("mascotBtn");
    mascot = new window.Qevr.Mascot(document.getElementById("mascotCanvas"), {
      host: btn, cell: cellFor(), face: "Default"
    });
    wireHold(btn);
    placeMascot();

    /* A18: every arrival is an entrance. a quick loading bar, then he builds
       himself in, then the ritual: DEFAULT, ANIME, FELIZ DA VIDA, then the
       brain takes over on São Paulo time. reduced motion goes straight in. */
    var bootBar = document.getElementById("bootBar");
    var bootFill = bootBar.querySelector("i");
    if (reduce) {
      bootBar.style.display = "none";
      mascot.setFace(hourFace(), true);
      mascot.start(boundsFor());
    } else {
      /* start empty: he is not there yet */
      var savedRender = new Uint8Array(mascot.render);
      mascot.render.fill(0);
      mascot.paint();
      var lp = 0;
      (function bootStep() {
        lp += 25;
        bootFill.style.width = Math.min(100, lp) + "%";
        if (lp < 100) { setTimeout(bootStep, 90); return; }
        bootBar.style.display = "none";
        /* he builds in: cells arriving in stepped random chunks */
        var idx = [];
        for (var i = 0; i < savedRender.length; i++) if (savedRender[i]) idx.push(i);
        for (var j = idx.length - 1; j > 0; j--) {
          var k = Math.floor(Math.random() * (j + 1));
          var t = idx[j]; idx[j] = idx[k]; idx[k] = t;
        }
        var frames = 6, per = Math.ceil(idx.length / frames), p = 0;
        (function build() {
          for (var n = 0; n < per && p < idx.length; n++, p++) mascot.render[idx[p]] = savedRender[idx[p]];
          mascot.paint();
          if (p < idx.length) { setTimeout(build, 55); return; }
          setTimeout(function () { mascot.setFace("Anime"); }, 700);
          setTimeout(function () { mascot.setFace("Joy"); }, 2000);
          setTimeout(function () {
            mascot.start(boundsFor());
            mascot.setFace(hourFace());
          }, 3300);
        })();
      })();
    }

    window.addEventListener("pointermove", function (e) {
      var r = btn.getBoundingClientRect();
      var cx = r.left + r.width / 2;
      mascot._look = { x: Math.max(-10, Math.min(10, (e.clientX - cx) / 40)) };
    }, { passive: true });

    watchSections();

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () {
        drawAllCells(); unifyToggleHeadings(); paintStamp(); placeMascot();
      });
    }
  }).catch(function (err) { console.error("[qiqi] boot failed", err); });

  window.addEventListener("scroll", onScroll, { passive: true });
  var rt;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      [].forEach.call(document.querySelectorAll(".heading--toggle canvas"), function (c) { c.removeAttribute("data-force-cell"); });
      closeBay();
      drawAllCells(); unifyToggleHeadings(); paintStamp(); onScroll(); placeMascot(); syncJump();
    }, 150);
  });
})();
</script>
