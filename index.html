<style>
/* The page consumes the shared ladder without changing the legacy fallbacks.
   Companion and boot reservation are deliberately live with either flag. */
.thermo { z-index: var(--z-rail, 55); }
.bar { z-index: var(--z-header, 60); }
.doors { z-index: var(--z-doors, 56); }
.poster { z-index: var(--z-poster, 90); }
.companion { z-index: var(--z-companion, 57); }

/* One zero-layout rule marks the exact page boundary at every width. */
html.is-next .arrival::after {
  content: "";
  position: absolute;
  left: calc(50% - var(--rail) / 2);
  bottom: -1px;
  width: 100vw;
  border-bottom: var(--rule) solid var(--brand);
  transform: translateX(-50%);
  pointer-events: none;
}
html.is-next body:not(.is-read-active) .blocks { visibility: hidden; }
html.is-next body.is-read-active .arrival { visibility: hidden; }
/* While the hard pager decides which page owns the viewport, keep the
   outgoing arrival pinned as a complete screen. The hidden read can never
   expose a black third frame, and the thermometer may still count all twelve
   physical transition steps. */
html.is-next body:not(.is-read-active) .arrival {
  position: sticky;
  top: var(--bar);
  z-index: var(--z-content);
  background: var(--ground);
}
html.is-next .blocks { min-height: calc(100svh - var(--bar)); }
html.is-next .arrival__question { display: none; }
html.is-next .arrival__signal[data-signal-takeover] .arrival__hint { visibility: hidden; }
html.is-next .arrival__signal .mascot__tag {
  position: static;
  inset: auto;
  transform: none;
  grid-area: 1 / 1;
}

html.is-next .switches { display: none; }
html.is-next .bar__dock {
  display: flex;
  align-items: stretch;
  margin-left: auto;
  min-width: 0;
}
html.is-next .bar__dock #langToggle {
  min-width: 44px;
  padding: 0 10px;
  border: 0;
  border-left: var(--rule) solid var(--qevr-hair);
  background: var(--ground);
  color: var(--qevr-muted);
  font: inherit;
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  cursor: pointer;
}
html.is-next .bar__dock #langToggle:hover,
html.is-next .bar__dock #langToggle:focus-visible {
  color: var(--qevr-ink);
  background: var(--qevr-light);
  outline: 0;
}
html.is-next .bar__dock #colorToggle {
  display: block;
  min-width: 58px;
  height: 100%;
  padding: 0;
  border: 0;
  border-left: var(--rule) solid var(--qevr-hair);
  font: inherit;
  cursor: pointer;
}
html.is-next .bar__dock #colorToggle.to-pink { background: var(--qevr-pink); }
html.is-next .bar__dock #colorToggle.to-green { background: var(--qevr-body); }
html.is-next .bar__dock #colorToggle:hover,
html.is-next .bar__dock #colorToggle:focus-visible,
html.is-next .bar__dock #colorToggle:active {
  background: var(--qevr-light);
  outline: 0;
}
html.is-next { --thermo-cell: calc(100dvh / 12); }

/* Fable 2026-09-02: the desktop read is ONE screen, like LIVE — rail, bay,
   stamp and doors all in view. The twelve thermometer cells count the
   arrival-to-read travel; the read itself never scrolls. (The agents' 200svh
   frame pushed the doors below the fold at every desktop stop.) */
@media (min-width: 431px) {
  html.is-next .blocks {
    display: flex;
    flex-direction: column;
    min-height: calc(100svh - var(--bar));
  }
  html.is-next .blocks #panel { flex: 1 1 auto; }
  html.is-next .blocks .doors { flex: 0 0 auto; margin-top: 0; }
}

@media (max-width: 430px) {
  /* GP 2026-09-01 (fourth flag): QIQI fills the bar vertically. The
     stacked unit hugs the rooms: the colour chip is the top half of the
     bar and the language label the bottom half — two full blocks. */
  html.is-next .bar__mark { flex: 0 0 auto; width: auto; padding-left: 10px; padding-right: 8px; }
  html.is-next .bar__dock {
    flex: 0 0 auto;
    margin-left: auto;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    min-width: 44px;
    height: 100%;
  }
  html.is-next .bar__nav { flex: 0 1 auto; }
  html.is-next .bar__dock #langToggle {
    order: 1;
    flex: 1 1 50%;
    min-width: 0;
    min-height: 0;
    padding: 0 8px;
    border: 0;
    background: transparent;
    font-size: 9px;
    letter-spacing: .1em;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  html.is-next .bar__dock #colorToggle {
    order: 0;
    flex: 1 1 50%;
    display: block;
    width: 100%;
    min-width: 0;
    min-height: 0;
    height: auto;
    border: 0;
  }

  /* The manifesto read is one physical screen. The arrival may hand off to
     it, but nothing inside this frame is allowed to create a third page or
     a nested scroll area. */
  html.is-next body.is-read-active { overscroll-behavior-y: none; }
  /* Once page two owns the phone viewport, its physical frame also owns the
     viewport floor. Bottom-sticky keeps that frame visually locked while a
     new dynamic viewport is propagating, even before resize JavaScript can update the
     document's page-end scroll offset. The element stays in flow, so the
     two-page document height and thermometer progression remain intact. */
  html.is-next body.is-read-active .blocks {
    position: sticky;
    bottom: 0;
    z-index: var(--z-content);
  }
  html.is-next .blocks {
    height: calc(100svh - var(--bar));
    min-height: calc(100svh - var(--bar));
    max-height: calc(100svh - var(--bar));
    padding-top: 0;
    overflow: clip;
    /* The floor doors extend across the 14px thermometer rail. Expand only
       the paint clip so their higher ruled layer can actually cover it. */
    overflow-clip-margin: var(--rail);
  }
  html.is-next .blocks #panel {
    flex: 1 1 0;
    min-height: 0;
    overflow: clip;
  }
  html.is-next .blocks .panel__rail {
    flex: 1 1 0;
    min-height: 0;
    overflow: clip;
  }
  /* GP 2026-08-31: CLOSED, the five heads stretch and split the whole room
     between the header and the doors — the live law kept inside the fixed
     frame. Their labels run big from the left with a small right gutter. */
  html.is-next .blocks .panel__head {
    flex: 1 1 0;
    min-height: 44px;
    padding: 4px 8px 4px calc(var(--rail) + 10px);
  }
  /* OPEN, the five rows KEEP stretching — they absorb every pixel the bay
     does not need. The bay hugs its own section: JavaScript sets its height
     once per section (content plus the tallest inner line) so expanding an
     item never resizes the box. Type never rescales. */
  html.is-next .blocks.is-open .panel__head {
    flex: 1 1 0;
    min-height: 44px;
    padding: 4px 8px 4px calc(var(--rail) + 10px);
  }
  html.is-next .blocks.is-open .panel__rail > .panel__bay {
    flex: 0 0 auto;
    height: auto;
    min-height: 0;
    padding: 5px 10px 3px calc(var(--rail) + 10px);
    overflow: clip;
    overscroll-behavior: none;
  }
  /* GP 2026-09-01: the copy keeps the site's own phone rhythm — the base
     13px/1.62 paragraphs rule here untouched. The permanent transition-fire
     is a state, not an event: its wash never bleeds over the read. */
  /* Fable 2026-09-02 (GP's flag: a black seam between the rail and a
     hovered row): the rows and the bay run FULL BLEED from the screen's left
     edge and the thermometer paints ABOVE them — the ruled ladder, done with
     z-order instead of a transparent border. Header, doors and companion
     stay above the rail. */
  html.is-next:root { --z-rail: 25; }
  html.is-next .blocks #panel {
    width: 100vw;
    margin-left: calc(0px - var(--rail) - var(--gut));
    margin-right: 0;
  }
  /* Fable 2026-09-02: the list inside the bay is a MINI RAIL. At rest its
     rows stretch and split the bay exactly the way the five sections split
     the screen — there is never a void under the last item. Open one line
     and the other rows give back only what that line needs, down to a
     one-line floor. The bay's height is fixed per section (JavaScript sets
     it once: the compressed rows plus the tallest possible line), so
     nothing outside the bay ever moves. */
  html.is-next .blocks .panel__bay { --row-min: 26px; }
  html.is-next .blocks .panel__bay .panel__bay-copy.is-list,
  html.is-next .blocks .panel__bay .panel__bay-copy.is-list > div {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
  }
  html.is-next .blocks .panel__bay .head-lines,
  html.is-next .blocks .panel__bay #stancesGrid {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
  }
  html.is-next .blocks .panel__bay .panel__bay-copy .stance {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
    flex: 1 1 0;
    min-height: var(--row-min);
    padding: 0 8px 0 0;
    letter-spacing: 0;
  }
  html.is-next .blocks .panel__bay .panel__bay-copy .stances__bay { flex: 0 0 auto; }
  /* the measuring probe: JavaScript flips this on for one frame to read the
     compressed floor of the list */
  html.is-next .blocks .panel__bay .panel__bay-copy .is-probe-min .stance {
    flex: 0 0 auto;
    height: var(--row-min);
    min-height: 0;
    padding: 0;
  }
  /* the visual row keeps the reading rhythm; the touch target quietly
     extends toward the 44px floor */
  html.is-next .blocks .panel__bay .panel__bay-copy .stance::before {
    content: "";
    position: absolute;
    inset: -5px 0;
  }
  /* the hit extension never reaches past the list itself */
  html.is-next .blocks .panel__bay .panel__bay-copy .stance:first-child::before { top: 0; }
  html.is-next .blocks .panel__bay .panel__bay-copy .stance:last-child::before { bottom: 0; }
  html.is-next .blocks .panel__bay .panel__bay-copy .stance__head {
    display: block;
    font-size: 12.5px;
    line-height: 1.45;
    letter-spacing: .02em;
  }
  html.is-next .blocks .panel__bay .panel__bay-copy .stances__bay {
    width: 100%;
    padding: 2px 8px 8px 0;
  }
  html.is-next .blocks .panel__bay .stances__bay-copy p {
    font-size: 12.5px;
    line-height: 1.5;
    letter-spacing: .02em;
  }
  html.is-next .blocks .panel__bay .stances__bay-copy p + p { margin-top: .5em; }
  /* NOS VEMOS NA PISTA lives only inside UM PRESENTE, running long and
     sitting low so it nearly touches the doors. */
  html.is-next .blocks .panel__bay > .stampband {
    flex: 0 0 auto;
    margin-top: auto;
    padding: 4px 0 2px;
  }
  html.is-next .blocks .panel__bay > .stampband .stamp { margin-top: 0; }
  html.is-next .blocks .panel__bay > .stampband .stamp__band { padding-top: 2px; }
  html.is-next .blocks .panel__bay > .stampband .stamp__city { margin-top: 2px; font-size: 7px; line-height: 1.2; }
  html.is-next .blocks .doors { flex: 0 0 auto; margin-top: auto; }
  /* Fable 2026-09-02 (GP's flag: the doors detach from the floor while a
     phone scrolls): in the phone read the DOORS leave the frame. JavaScript
     moves them out of .blocks and they are fixed to the screen's floor on
     their own rung of the ladder — the frame can lag a toolbar animation,
     the doors cannot. The frame keeps a floor of their height, the page
     refuses over-scroll, and the safe-area zone under the doors paints as
     part of the doors, divider included. */
  html.is-next:root { overscroll-behavior-y: none; }
  html.is-next .blocks { padding-bottom: var(--doors-h, 0px); }
  html.is-next main > .doors {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    width: auto;
    margin: 0;
    z-index: var(--z-doors);
  }
  html.is-next body:not(.is-read-active) main > .doors { visibility: hidden; }
  html.is-next .doors {
    padding-bottom: var(--safe-bottom, env(safe-area-inset-bottom, 0px));
    background: linear-gradient(90deg, var(--qevr-light) 0 calc(50% - 1px), var(--qevr-hair) calc(50% - 1px) calc(50% + 1px), var(--qevr-light) calc(50% + 1px));
  }

  /* AS REGRAS keeps its pop; the sheet runs narrow and tall, the badge
     hangs outside it on the scrim on purpose, and the sheet floor keeps
     open air before the foot line. */
  html.is-next .poster { padding: 14px 0; }
  html.is-next .poster__in { width: min(78vw, 300px); }
  /* Fable 2026-09-02: the sheet keeps its A4 body but USES it — the seven
     rules spread over the full height at a readable size instead of
     bunching at the top over a dead lower half. The badge stays outside
     on the scrim; the companion hides while the poster is up, so there is
     one QIQI on screen, the angry one. */
  html.is-next .poster__sheet { width: 100%; max-height: calc(100svh - 96px); padding-bottom: var(--poster-pad); }
  html.is-next .poster__body { flex: 1 1 auto; display: flex; min-height: 0; }
  html.is-next .poster__rules { flex: 1 1 auto; justify-content: space-between; padding-right: 14px; }
  html.is-next .poster__rule { padding: 5px 0; }
  html.is-next .poster__rule b { font-size: 10.5px; }
  html.is-next .poster__rule i { font-size: 8.5px; line-height: 1.4; }
  html.is-next .poster__art { right: calc(0px - var(--poster-pad) - var(--poster-edge) - 30px); top: -6px; transform: none; }
  html.is-next .poster.on ~ .companion { visibility: hidden; }
  /* the section sub-titles drop on phones (?subs=on brings them back) */
  html.is-next:not(.with-subs) .blocks .panel__bay-sub { display: none; }

  /* svh above is the compatibility floor. Modern mobile browsers get the
     live toolbar-aware room so both physical pages and the doors follow the
     visible viewport without JavaScript-authored pixel heights. */
  @supports (height: 100dvh) {
    html.is-next .arrival { min-height: calc(100dvh - var(--bar)); }
    html.is-next .blocks {
      height: calc(100dvh - var(--bar));
      min-height: calc(100dvh - var(--bar));
      max-height: calc(100dvh - var(--bar));
    }
  }
}
</style>

<script>
(function () {
  "use strict";

  const NEXT = document.documentElement.classList.contains("is-next");
  /* Shipped 2026-09-02: one shared label size (B) is the default; ?labels=perrow
     shows the per-row fill (A) for GP's ruling. Sub-titles are off on phones;
     ?subs=on shows them. */
  const LABELS_SHARED = NEXT && new URLSearchParams(location.search).get("labels") !== "perrow";
  if (NEXT && new URLSearchParams(location.search).get("subs") === "on") document.documentElement.classList.add("with-subs");
  /* preview-only: simulate a phone's home-indicator inset (?inset=34) */
  if (NEXT && /^\d+$/.test(new URLSearchParams(location.search).get("inset") || "")) document.documentElement.style.setProperty("--safe-bottom", new URLSearchParams(location.search).get("inset") + "px");
  var MODE_KEY = "qevr.mode";
  var forced = (location.search.match(/[?&]mode=(day|party)(?:&|$)/) || [])[1];
  function readModePreference() {
    try {
      var mode = localStorage.getItem(MODE_KEY);
      return mode === "day" || mode === "party" ? mode : null;
    } catch (e) { return null; }
  }
  function writeModePreference(mode) {
    if (mode !== "day" && mode !== "party") return;
    try { localStorage.setItem(MODE_KEY, mode); } catch (e) {}
  }
  document.documentElement.setAttribute("data-mode", forced || readModePreference() || "day");

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var canHover = window.matchMedia && window.matchMedia("(hover: hover)").matches;

  /* the language works like the colour: a preference that sticks, a ?lang=
     preview that doesn't, and switching rooms runs the same QR cascade */
  var LANG_KEY = "qevr.lang";
  function readLang() {
    var forcedLang = (location.search.match(/[?&]lang=(pt|en)(?:&|$)/) || [])[1];
    if (forcedLang) return forcedLang;
    try { var l = localStorage.getItem(LANG_KEY); if (l === "pt" || l === "en") return l; } catch (e) {}
    return "pt";
  }
  var LANG = readLang();
  document.documentElement.lang = LANG === "en" ? "en" : "pt-BR";
  function chooseLang(next) {
    if (next === LANG) return;
    try { localStorage.setItem(LANG_KEY, next); } catch (e) {}
    window.QevrCascade.through(function () {
      var nextURL = new URL(location.href);
      nextURL.searchParams.delete("lang");
      location.href = nextURL.pathname + nextURL.search + nextURL.hash;
    });
  }
  /* the block names what it turns into: site in PT shows EN, and back */
  document.getElementById("langToggle").textContent = LANG === "pt" ? "EN" : "PT";
  document.getElementById("langToggle").addEventListener("click", function () { chooseLang(LANG === "pt" ? "en" : "pt"); });

  function cssVar(n, fb) {
    return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || fb;
  }
  function brandColor() { return cssVar("--brand", "#CCFF00"); }
  function mutedColor() { return cssVar("--qevr-muted", "#9A9AA5"); }
  function inkColor() { return cssVar("--qevr-ink", "#09090B"); }

  /* ---------- headings drawn from the mascot's own cells.
     the type engine finally performs: closed headings render DIM, the open
     one is the only brand heading on screen, opening IGNITES it in chunks,
     and a touch makes it flinch one shear beat. ---------- */
  function drawCells(canvas, opts) {
    opts = opts || {};
    var text = canvas.getAttribute("data-cells");
    var m = window.QevrType.textMatrix(text);
    var fitMax = parseFloat(canvas.getAttribute("data-fit"));
    var host = canvas.parentElement;
    var room = host.clientWidth || window.innerWidth;
    var avail = Math.min(room, fitMax || 400);
    var forcedCell = parseFloat(canvas.getAttribute("data-force-cell"));
    var cell = forcedCell ? forcedCell : Math.max(2, Math.floor(avail / m.w));
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = m.w * cell * dpr;
    canvas.height = m.h * cell * dpr;
    canvas.style.width = (m.w * cell) + "px";
    canvas.style.height = (m.h * cell) + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, m.w * cell, m.h * cell);
    var dim = opts.dim != null ? opts.dim : canvas.hasAttribute("data-dim");
    ctx.fillStyle = opts.color || (dim ? mutedColor() : brandColor());
    for (var y = 0; y < m.h; y++) {
      var shear = opts.shear && opts.shear[y] ? opts.shear[y] : 0;
      for (var x = 0; x < m.w; x++) {
        var i = y * m.w + x;
        if (!m.cells[i]) continue;
        if (opts.mask) {
          ctx.fillStyle = opts.mask[i] ? brandColor() : mutedColor();
        }
        ctx.fillRect((x + shear) * cell, y * cell, cell, cell);
      }
    }
    canvas.setAttribute("role", "img");
    canvas.setAttribute("aria-label", text);
    canvas._matrix = m;
    canvas._cell = cell;
    return m;
  }
  function fitBarMark() {
    var c = document.querySelector(".bar__mark canvas");
    if (!c || !window.QevrType) return;
    if (NEXT && isNextPhone()) {
      /* GP 2026-09-01 (fourth flag): QIQI fills the bar vertically */
      var m = window.QevrType.textMatrix(c.getAttribute("data-cells"));
      var cell = String(Math.max(2, Math.floor(44 / m.h)));
      if (c.getAttribute("data-force-cell") !== cell) {
        c.setAttribute("data-force-cell", cell);
        drawCells(c);
      }
      return;
    }
    if (c.hasAttribute("data-force-cell")) {
      c.removeAttribute("data-force-cell");
      drawCells(c);
    }
  }
  function drawAllCells() {
    [].forEach.call(document.querySelectorAll("canvas[data-cells]"), function (c) {
      if (c.hasAttribute("data-doorword")) { drawDoorWord(c, false); return; }
      drawCells(c);
    });
    fitBarMark();
    syncHeadingDim();
  }

  /* closed headings are the quiet ones; the open one carries the heat (M-A) */
  function syncHeadingDim() {
    [].forEach.call(document.querySelectorAll(".panel__head"), function (b) {
      var c = b.querySelector("canvas");
      if (!c) return;
      var open = b.id === activeSection;
      if (open) c.removeAttribute("data-dim"); else c.setAttribute("data-dim", "1");
      drawCells(c);
    });
  }

  /* GP-06: the opening click GLITCHES — a hard two-frame shear, then the
     heading lands in the brand. no cube-flip. */
  function shearOpen(canvas) {
    canvas.removeAttribute("data-dim");
    if (reduce) { drawCells(canvas); return; }
    var band = 2 + Math.floor(Math.random() * 5);
    var shear = {}; shear[band] = 1; shear[band + 1] = 1;
    drawCells(canvas, { shear: shear });
    setTimeout(function () {
      var shear2 = {}; shear2[band + 2] = -1;
      drawCells(canvas, { shear: shear2 });
      setTimeout(function () { drawCells(canvas); }, 70);
    }, 70);
  }

  /* one shear beat: a row band slips sideways for two frames and snaps back */
  function flinch(canvas, color) {
    if (reduce || canvas._flinching) return;
    canvas._flinching = true;
    var band = 2 + Math.floor(Math.random() * 5);
    var shear = {}; shear[band] = 1; shear[band + 1] = 1;
    drawCells(canvas, { shear: shear, dim: canvas.hasAttribute("data-dim"), color: color });
    setTimeout(function () {
      drawCells(canvas, color ? { color: color } : undefined);
      canvas._flinching = false;
    }, 90);
  }

  var COPY = null, mascot = null;

  function syncArrivalColor() {
    var party = document.documentElement.getAttribute("data-mode") === "party";
    document.getElementById("arrivalGreen").setAttribute("aria-pressed", String(!party));
    document.getElementById("arrivalPink").setAttribute("aria-pressed", String(party));
    var colorToggle = document.getElementById("colorToggle");
    colorToggle.classList.toggle("to-pink", !party);
    colorToggle.classList.toggle("to-green", party);
    if (COPY && COPY.ui) colorToggle.setAttribute("aria-label", party ? COPY.ui.green : COPY.ui.pink);
  }

  function repaintBrand() {
    drawAllCells();
    paintStamp();
    paintScrollArrow();
    if (mascot) mascot.paint();
  }

  /* ---------- L02: he molts FIRST, the page follows through the QR cascade ----------
     picking a colour repaints HIS body cells in stepped chunks on his own canvas,
     and only when he finishes does the page cross the same cascade as a room change. */
  var MODE_HEX = { day: "#CCFF00", party: "#FF007F" };
  function moltTo(mode) {
    if (document.documentElement.getAttribute("data-mode") === mode) return;
    if (!mascot || reduce) {
      document.documentElement.setAttribute("data-mode", mode);
      writeModePreference(mode);
      syncArrivalColor();
      repaintBrand();
      return;
    }
    mascot._busy = true;
    var target = MODE_HEX[mode];
    var ctx = mascot.canvas.getContext("2d");
    var C = window.Qevr.CROP, n = mascot.n, c = mascot.cell;
    var bodyIdx = [];
    for (var i = 0; i < mascot.render.length; i++) if (mascot.render[i] === 1) bodyIdx.push(i);
    for (var j = bodyIdx.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var t = bodyIdx[j]; bodyIdx[j] = bodyIdx[k]; bodyIdx[k] = t;
    }
    mascot.glitch();
    var frames = 5, per = Math.ceil(bodyIdx.length / frames), p = 0;
    function paintIdx(idx, color) {
      var y = Math.floor(idx / n), x = idx % n;
      var gy = y - C.y0, gx = x - C.x0;
      if (gy < 0 || gy >= C.h || gx < 0 || gx >= C.w) return;
      ctx.fillStyle = color;
      ctx.fillRect(gx * c, gy * c, c, c);
    }
    setTimeout(function step() {
      for (var m = 0; m < per && p < bodyIdx.length; m++, p++) paintIdx(bodyIdx[p], target);
      if (p < bodyIdx.length) { setTimeout(step, 55); return; }
      /* he finished. now the page follows through its own QR grammar. */
      window.QevrCascade.through(function () {
        document.documentElement.setAttribute("data-mode", mode);
        writeModePreference(mode);
        syncArrivalColor();
        repaintBrand();
        mascot._busy = false;
      });
    }, 180);
  }

  syncArrivalColor();
  document.getElementById("arrivalGreen").addEventListener("click", function () { moltTo("day"); });
  document.getElementById("arrivalPink").addEventListener("click", function () { moltTo("party"); });
  document.getElementById("colorToggle").addEventListener("click", function () {
    moltTo(document.documentElement.getAttribute("data-mode") === "party" ? "day" : "party");
  });

  function para(entry, cls) {
    var p = document.createElement("p");
    var line = typeof entry === "string" ? { t: entry } : entry;
    var emphasis = cls || (line && (line.em === "dim" || line.em === "mark") ? line.em : "");
    if (emphasis) p.className = emphasis;
    p.textContent = line && line.t ? line.t : "";
    return p;
  }

  var headerDock = document.getElementById("headerDock");
  var langToggle = document.getElementById("langToggle");
  var colorToggle = document.getElementById("colorToggle");
  var colorToggleHome = colorToggle.parentElement;
  var colorToggleNext = colorToggle.nextSibling;
  var phoneReadPageEnd = 0;
  var phoneZoomOwner = null;
  function syncHeaderDock(readActive) {
    if (!NEXT || !headerDock) return;
    headerDock.appendChild(langToggle);
    if (readActive) {
      headerDock.appendChild(colorToggle);
    } else if (colorToggle.parentElement !== colorToggleHome) {
      colorToggleHome.insertBefore(colorToggle, colorToggleNext);
    }
  }
  function syncReadActive() {
    if (!NEXT) return;
    if (isNextPhone() && isPinchZoomed()) return;
    var blocksEl = document.querySelector(".blocks");
    var barEl = document.querySelector(".bar");
    if (!blocksEl || !barEl) return;
    var phonePageEnd = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    var atCurrentPhoneEnd = window.scrollY >= phonePageEnd - 1;
    var atPriorPhoneEnd = document.body.classList.contains("is-read-active")
      && phoneReadPageEnd > 0
      && Math.abs(window.scrollY - phoneReadPageEnd) <= 2;
    var remainsOnReadSide = document.body.classList.contains("is-read-active")
      && phonePageEnd > 0
      && window.scrollY >= phonePageEnd / 2;
    var readActive = isNextPhone()
      ? atCurrentPhoneEnd || atPriorPhoneEnd || remainsOnReadSide
      : blocksEl.getBoundingClientRect().top <= barEl.getBoundingClientRect().bottom + 1;
    if (isNextPhone() && atCurrentPhoneEnd) phoneReadPageEnd = phonePageEnd;
    document.body.classList.toggle("is-read-active", readActive);
    syncHeaderDock(readActive);
  }

  function syncTitles() {
    var map = [
      ["manifesto", COPY.world],
      ["pessoas", COPY.people],
      ["stances", COPY.stances],
      ["regras", COPY.nevers],
      ["presente", COPY.gift]
    ];
    map.forEach(function (pair) {
      var head = document.getElementById(pair[0]);
      if (!head) return;
      var c = head.querySelector("canvas");
      if (c && pair[1].title) c.setAttribute("data-cells", pair[1].title);
      panelSubs[pair[0]] = pair[1].sub || "";
      panelFaces[pair[0]] = pair[1].face || "Default";
    });
  }

  /* ---------- M-A: five invariant headings and ONE fitted bay.
     The frame never resizes; selected content and its stamp remain one piece
     and fit the available phone room (GP-07 + GP 2026-08-31). ---------- */
  var activeSection = null, panelSubs = {}, panelFaces = {}, panelContent = {}, panelContentPhone = {}, bayGen2 = 0, bayBlinkTimer = 0;
  function bayEls() {
    return {
      bay: document.getElementById("bay"),
      slot: document.getElementById("bayFitSlot"),
      fit: document.getElementById("bayFit"),
      sub: document.getElementById("baySub"),
      copy: document.getElementById("bayCopy"),
      cursor: document.getElementById("bayCursor")
    };
  }
  function startBayCursor() {
    var cursor = document.getElementById("bayCursor");
    if (bayBlinkTimer || !cursor) return;
    bayBlinkTimer = setInterval(function () {
      cursor.style.visibility = cursor.style.visibility === "hidden" ? "visible" : "hidden";
    }, 600);
  }
  function renderSection(id, opts) {
    opts = opts || {};
    var els = bayEls();
    bayGen2++;
    closeBay();
    els.sub.textContent = id ? (panelSubs[id] || "") : "";
    els.copy.innerHTML = "";
    els.copy.classList.remove("is-list");
    if (!id) return;
    /* D2 (shipped 2026-09-02): the accordion is a phone device — desktop
       shows every line, as LIVE always did */
    var content = (NEXT && isNextPhone() && panelContentPhone[id]) || panelContent[id];
    if (!content) return;
    els.copy.appendChild(content);
    /* a list section runs the mini rail (PROPOSED phones); paragraphs don't */
    els.copy.classList.toggle("is-list", !!content.querySelector(".stances__grid"));
    if (opts.instant || reduce) return;
    /* the words arrive in three hard chunks — never letter by letter */
    var g = bayGen2;
    var parts = [].slice.call(content.children.length ? content.children : [content]);
    var blocksList = [];
    parts.forEach(function (node) {
      if (node.children.length && !node.classList.contains("stances__grid")) {
        [].forEach.call(node.children, function (child) { blocksList.push(child); });
      } else blocksList.push(node);
    });
    blocksList.forEach(function (b) { b.style.visibility = "hidden"; });
    var steps = 3, per = Math.ceil(blocksList.length / steps), p = 0;
    (function step() {
