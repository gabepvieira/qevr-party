<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QEVR</title>
<meta name="description" content="QEVR. NASCEU DAS NOITES DE UMA PESSOA E PERTENCE A TODO MUNDO QUE TEM NOITES ASSIM.">
<meta name="theme-color" content="#09090B">
<meta property="og:title" content="QEVR">
<meta property="og:description" content="O APP TRAZ O FATO. O RESTO É COM VOCÊ.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<div class="thermo" id="thermo" aria-hidden="true"><div class="thermo__fill" id="thermoFill"></div></div>

<header class="bar">
  <a class="bar__mark" href="#topo" aria-label="QEVR"><canvas data-cells="QEVR" data-fit="108"></canvas></a>
  <nav class="bar__nav">
    <a href="#manifesto" aria-current="page">MANIFESTO</a>
    <a href="studio/">O ESTÚDIO</a>
  </nav>
</header>

<main>
  <section class="arrival" id="topo">
    <div class="arrival__left">
      <div class="arrival__word"><canvas data-cells="QEVR" data-fit="560"></canvas></div>
      <div class="arrival__city"><canvas data-cells="SÃO PAULO" data-fit="280" data-dim="1"></canvas></div>
      <div class="arrival__rule"></div>
      <div class="doors" id="doors"></div>
    </div>
    <div class="arrival__mascot" id="arrivalSlot">
      <button class="mascot" id="mascotBtn" aria-label="QEVR"><canvas id="mascotCanvas"></canvas></button>
    </div>
  </section>

  <section id="manifesto">
    <div class="heading"><canvas data-cells="O MUNDO" data-fit="420"></canvas></div>
    <div class="world__grid">
      <div class="world__col copy" id="worldCopy"></div>
      <div class="world__col">
        <div class="people__lead" id="peopleLead"></div>
        <div id="peopleList"></div>
        <div class="world__close" id="worldClose"></div>
      </div>
    </div>
  </section>

  <section id="stances" data-open="true">
    <button class="heading heading--toggle" id="stancesToggle" aria-expanded="true" aria-controls="stancesGrid">
      <canvas data-cells="O JEITO DELE" data-fit="470" data-reserve="58"></canvas><span class="heading__mark"></span>
    </button>
    <div class="stances__grid" id="stancesGrid"></div>
  </section>

  <section class="closing" id="fim">
    <div class="closing__col" id="regras" data-open="true">
      <button class="heading heading--toggle" id="regrasToggle" aria-expanded="true" aria-controls="neversList">
        <canvas data-cells="REGRAS" data-fit="300" data-reserve="58"></canvas><span class="heading__mark"></span>
      </button>
      <div id="neversList"></div>
    </div>
    <div class="closing__col gift">
      <div class="heading"><canvas data-cells="UM PRESENTE" data-fit="420"></canvas></div>
      <div class="copy" id="giftCopy"></div>
    </div>
    <div class="stamp" id="stamp"></div>
  </section>
</main>

<div class="companion" id="companionSlot" aria-hidden="true"></div>

<script src="assets/pixelfont.js"></script>
<script src="assets/qevr.js"></script>
<script src="assets/cascade.js"></script>
<script>
(function () {
  "use strict";

  /* lime only for now. the time-of-day flip is built and waiting in site.css. */
  var TIME_AWARE = false;
  var h = new Date().getHours();
  var mode = TIME_AWARE ? ((h >= 23 || h < 7) ? "party" : (h === 7 ? "dawn" : "day")) : "day";
  var forced = (location.search.match(/[?&]mode=(day|party|dawn)/) || [])[1];
  document.documentElement.setAttribute("data-mode", forced || mode);

  function cssVar(n, fb) {
    return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || fb;
  }
  function brandColor() { return cssVar("--brand", "#CCFF00"); }
  function mutedColor() { return cssVar("--qevr-muted", "#9A9AA5"); }

  /* ---------- headings drawn from the mascot's own cells ---------- */
  function drawCells(canvas) {
    var text = canvas.getAttribute("data-cells");
    var m = window.QevrType.textMatrix(text);
    var fitMax = parseFloat(canvas.getAttribute("data-fit"));
    var host = canvas.parentElement;
    /* leave room for anything sitting beside the heading, like a toggle mark */
    var reserve = parseFloat(canvas.getAttribute("data-reserve")) || 0;
    var room = (host.clientWidth || window.innerWidth) - reserve;
    var avail = Math.min(room, fitMax || 400);
    var cell = Math.max(2, Math.floor(avail / m.w));
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = m.w * cell * dpr;
    canvas.height = m.h * cell * dpr;
    canvas.style.width = (m.w * cell) + "px";
    canvas.style.height = (m.h * cell) + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, m.w * cell, m.h * cell);
    ctx.fillStyle = canvas.getAttribute("data-dim") ? mutedColor() : brandColor();
    for (var y = 0; y < m.h; y++) {
      for (var x = 0; x < m.w; x++) {
        if (m.cells[y * m.w + x]) ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }
    canvas.setAttribute("role", "img");
    canvas.setAttribute("aria-label", text);
  }
  function drawAllCells() { [].forEach.call(document.querySelectorAll("canvas[data-cells]"), drawCells); }

  var COPY = null, mascot = null;

  function para(text, cls) {
    var p = document.createElement("p");
    if (cls) p.className = cls;
    p.textContent = text;
    return p;
  }

  function syncTitles() {
    var map = [
      ["#manifesto .heading canvas", COPY.world.title],
      ["#stancesToggle canvas", COPY.stances.title],
      ["#regrasToggle canvas", COPY.nevers.title],
      [".gift .heading canvas", COPY.gift.title]
    ];
    map.forEach(function (pair) {
      var c = document.querySelector(pair[0]);
      if (c && pair[1]) c.setAttribute("data-cells", pair[1]);
    });
  }

  /* every move runs the QR cascade, the same entrance the app uses for his chat */
  function wireCascade() {
    window.QevrCascade.wireLinks(".bar__nav a, .door[href='studio/']");
    [].forEach.call(document.querySelectorAll("a[href^='#']"), function (a) {
      a.addEventListener("click", function (e) {
        var id = a.getAttribute("href").slice(1);
        var target = id && document.getElementById(id);
        if (!target) return;
        e.preventDefault();
        window.QevrCascade.through(function () {
          target.scrollIntoView({ behavior: "auto", block: "start" });
        });
      });
    });
  }

  /* on a phone the two long sections stay shut until you open them */
  function wireToggles() {
    [["stancesToggle", "stances"], ["regrasToggle", "regras"]].forEach(function (pair) {
      var btn = document.getElementById(pair[0]);
      var box = document.getElementById(pair[1]);
      if (!btn || !box) return;
      btn.addEventListener("click", function () {
        var open = box.getAttribute("data-open") === "true";
        window.QevrCascade.through(function () {
          box.setAttribute("data-open", open ? "false" : "true");
          btn.setAttribute("aria-expanded", open ? "false" : "true");
          if (open) box.scrollIntoView({ behavior: "auto", block: "start" });
        });
      });
    });
    if (isSmall()) {
      ["stances", "regras"].forEach(function (id) {
        var box = document.getElementById(id);
        if (box) box.setAttribute("data-open", "false");
      });
      document.getElementById("stancesToggle").setAttribute("aria-expanded", "false");
      document.getElementById("regrasToggle").setAttribute("aria-expanded", "false");
    }
  }

  function buildDoors() {
    var host = document.getElementById("doors");
    var d = COPY.doors;
    [["manifesto", "#manifesto", true], ["studio", "studio/", false]].forEach(function (spec) {
      var cfg = d[spec[0]];
      var a = document.createElement("a");
      a.className = "door" + (spec[2] ? " door--lead" : "");
      a.href = spec[1];
      var s = document.createElement("strong"); s.textContent = cfg.label; a.appendChild(s);
      var t = document.createElement("span"); t.textContent = cfg.sub; a.appendChild(t);
      host.appendChild(a);
    });
  }

  function buildWorld() {
    var w = COPY.world;
    var host = document.getElementById("worldCopy");
    w.paragraphs.forEach(function (t, i) { host.appendChild(para(t, i === 2 ? "dim" : "")); });

    document.getElementById("peopleLead").textContent = w.people.lead;
    var list = document.getElementById("peopleList");
    w.people.items.forEach(function (pair) {
      var row = document.createElement("div"); row.className = "person";
      var t = document.createElement("div"); t.className = "person__term"; t.textContent = pair[0];
      var d = document.createElement("div"); d.className = "person__def"; d.textContent = pair[1];
      row.appendChild(t); row.appendChild(d); list.appendChild(row);
    });

    var close = document.getElementById("worldClose");
    w.close.forEach(function (t) { close.appendChild(para(t)); });
  }

  function buildStances() {
    var grid = document.getElementById("stancesGrid");
    COPY.stances.items.forEach(function (item, i) {
      var b = document.createElement("button");
      b.className = "stance"; b.type = "button";
      b.setAttribute("aria-expanded", "false");
      var idx = document.createElement("span");
      idx.className = "stance__idx";
      idx.textContent = (i + 1 < 10 ? "0" : "") + (i + 1);
      b.appendChild(idx);
      var head = document.createElement("span");
      head.className = "stance__head"; head.textContent = item.head;
      b.appendChild(head);
      var body = document.createElement("span");
      body.className = "stance__body";
      item.body.forEach(function (t) { body.appendChild(para(t)); });
      b.appendChild(body);
      b.addEventListener("click", function () {
        var open = b.getAttribute("aria-expanded") === "true";
        [].forEach.call(grid.children, function (c) { c.setAttribute("aria-expanded", "false"); });
        b.setAttribute("aria-expanded", open ? "false" : "true");
        if (!open && mascot) {
          mascot.ignoredSince = Date.now();
          mascot.setFace(item.face);
          mascot.glitch();
        }
      });
      grid.appendChild(b);
    });
  }

  function buildNevers() {
    var host = document.getElementById("neversList");
    COPY.nevers.lines.forEach(function (pair) {
      var row = document.createElement("div"); row.className = "never";
      var k = document.createElement("div"); k.className = "never__key"; k.textContent = pair[0];
      var v = document.createElement("div"); v.className = "never__val"; v.textContent = pair[1];
      row.appendChild(k); row.appendChild(v); host.appendChild(row);
    });
  }

  function buildGift() {
    var host = document.getElementById("giftCopy");
    COPY.gift.paragraphs.forEach(function (t) { host.appendChild(para(t)); });
    var stamp = document.getElementById("stamp");
    var parts = COPY.stamp.split(". ");
    stamp.innerHTML = "";
    var b = document.createElement("b"); b.textContent = parts[0] + ".";
    stamp.appendChild(b);
    stamp.appendChild(document.createTextNode(" " + parts.slice(1).join(". ")));
  }

  /* ---------- he starts life size, then takes his corner ---------- */
  var inCorner = false;
  function isSmall() { return window.matchMedia("(max-width: 720px)").matches; }
  function cellFor() { return inCorner ? (isSmall() ? 3 : 4) : (isSmall() ? 6 : 10); }
  function boundsFor() {
    return inCorner ? { x: isSmall() ? 14 : 26, y: isSmall() ? 10 : 20 }
                    : { x: isSmall() ? 10 : 20, y: isSmall() ? 8 : 16 };
  }
  function placeMascot() {
    if (!mascot) return;
    var btn = document.getElementById("mascotBtn");
    var target = inCorner ? document.getElementById("companionSlot") : document.getElementById("arrivalSlot");
    if (btn.parentElement !== target) target.appendChild(btn);
    mascot.pos.x = 0; mascot.pos.y = 0; mascot.squash = 1;
    mascot.applyTransform();
    mascot.setCell(cellFor());
    mascot._bounds = boundsFor();
  }
  function checkCorner() {
    var arrival = document.getElementById("topo");
    if (!arrival) return;
    var b = arrival.getBoundingClientRect().bottom;
    var next = inCorner ? (b > 200 ? false : true) : (b < 90 ? true : false);
    if (next !== inCorner) { inCorner = next; placeMascot(); }
  }

  /* ---------- the thermometer replaces the scrollbar ---------- */
  var fill = document.getElementById("thermoFill");
  var thermo = document.getElementById("thermo");
  var wasFire = false;
  function onScroll() {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
    fill.style.height = (p * 100) + "%";
    var fire = p > 0.92;
    thermo.classList.toggle("is-fire", fire);
    if (fire && !wasFire && mascot) mascot.setFace(COPY ? COPY.gift.face : "Stars");
    wasFire = fire;
    checkCorner();
  }

  /* ---------- he reads it with you ---------- */
  function watchSections() {
    if (!("IntersectionObserver" in window)) return;
    var map = { manifesto: COPY.world.face, stances: "Default", fim: COPY.nevers.face };
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting || !mascot || wasFire) return;
        var f = map[e.target.id];
        if (f) mascot.setFace(f);
      });
    }, { threshold: 0.4 });
    Object.keys(map).forEach(function (id) {
      var el = document.getElementById(id);
      if (el) io.observe(el);
    });
  }

  drawAllCells();

  Promise.all([
    fetch("assets/manifesto.pt.json").then(function (r) { return r.json(); }),
    window.Qevr.load("assets/qevr-expressions.json")
  ]).then(function (res) {
    COPY = res[0];
    syncTitles();
    buildDoors(); buildWorld(); buildStances(); buildNevers(); buildGift();
    drawAllCells();
    wireCascade();
    wireToggles();
    onScroll();

    var btn = document.getElementById("mascotBtn");
    mascot = new window.Qevr.Mascot(document.getElementById("mascotCanvas"), {
      host: btn, cell: cellFor(), face: "Default"
    });
    mascot.start(boundsFor());
    btn.addEventListener("click", function () { mascot.poke(); });
    placeMascot();

    /* he notices you. 60 percent of the time it was nothing. */
    window.addEventListener("pointermove", function (e) {
      var r = btn.getBoundingClientRect();
      var cx = r.left + r.width / 2;
      mascot._look = { x: Math.max(-10, Math.min(10, (e.clientX - cx) / 40)) };
    }, { passive: true });

    watchSections();
  }).catch(function (err) { console.error("[qevr] boot failed", err); });

  window.addEventListener("scroll", onScroll, { passive: true });
  var rt;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () { drawAllCells(); onScroll(); placeMascot(); }, 150);
  });
})();
</script>
</body>
</html>
