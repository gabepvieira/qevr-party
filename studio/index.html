<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QEVR / O ESTÚDIO</title>
<meta name="description" content="AS 23 CARAS DO QEVR. UMA SÓ SILHUETA.">
<meta name="theme-color" content="#09090B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="studio.css">
</head>
<body>

<header class="bar">
  <div class="bar__in">
    <a class="bar__mark" href="../" aria-label="QEVR"><canvas data-cells="QEVR" data-fit="108"></canvas></a>
    <nav class="bar__nav">
      <a href="../#manifesto">O MANIFESTO</a>
      <a href="./" aria-current="page">O ESTÚDIO</a>
    </nav>
  </div>
</header>

<main class="studio">
  <div class="frame" id="frame">
    <div class="frame__strip frame__strip--top" id="stripTop"></div>
    <div class="frame__strip frame__strip--left" id="stripLeft"></div>

    <section class="plate" aria-labelledby="stageName">
      <div class="stage__art">
        <button class="mascot" id="stageBtn" aria-label="QEVR"><canvas id="stageCanvas"></canvas></button>
      </div>
      <div class="plate__panel">
        <div class="stage__read">
          <div class="stage__label" id="faceLabel">OLHA A CARINHA DELE</div>
          <div class="stage__name" id="stageName">NORMAL</div>
          <div class="stage__code"><span id="codeLabel">NO CÓDIGO</span> <b id="stageCode">DEFAULT</b></div>
        </div>
        <div class="stage__controls">
          <div class="ctlset">
            <div class="ctlset__label"><span class="lbl-long" id="moveLabel">ELE SE MEXE SOZINHO?</span><span class="lbl-short">SE MEXE?</span></div>
            <div class="ctlrow">
              <button class="ctl" id="ctlLive" type="button" aria-pressed="true">SIM</button>
              <button class="ctl" id="ctlHold" type="button" aria-pressed="false">NÃO</button>
            </div>
          </div>
          <div class="ctlset">
            <div class="ctlset__label"><span class="lbl-long" id="colorLabel">MUDE A COR DO QEVR</span><span class="lbl-short">COR</span></div>
            <div class="ctlrow">
              <button class="ctl ctl--swatch ctl--green" id="ctlGreen" type="button" aria-pressed="true"><i></i><span>VERDE</span></button>
              <button class="ctl ctl--swatch ctl--pink" id="ctlPink" type="button" aria-pressed="false"><i></i><span>ROSA</span></button>
            </div>
          </div>
          <div class="ctlset ctlset--glitch">
            <div class="ctlset__label"><span class="lbl-long" id="glitchLabel">CLIQUE AQUI</span><span class="lbl-short">CLIQUE AQUI</span></div>
            <div class="ctlrow"><button class="ctl" id="ctlGlitch" type="button">GLITCH</button></div>
          </div>
        </div>
        <div class="stage__meta" id="stageMeta"></div>
      </div>
    </section>

    <div class="frame__strip frame__strip--right" id="stripRight"></div>
    <div class="frame__strip frame__strip--bottom" id="stripBottom"></div>
  </div>
</main>

<script src="../assets/pixelfont.js"></script>
<script src="../assets/qevr.js"></script>
<script src="../assets/cascade.js"></script>
<script>
(function () {
  "use strict";

  var MODE_KEY = "qevr.mode";
  var TIME_AWARE = false;
  var hh = new Date().getHours();
  var auto = TIME_AWARE ? ((hh >= 23 || hh < 7) ? "party" : (hh === 7 ? "dawn" : "day")) : "day";
  var forced = (location.search.match(/[?&]mode=(day|party|dawn)(?:&|$)/) || [])[1];
  function readModePreference() {
    try {
      var mode = localStorage.getItem(MODE_KEY);
      return mode === "day" || mode === "party" ? mode : null;
    } catch (e) { return null; }
  }
  function writeModePreference(mode) {
    if (mode !== "day" && mode !== "party") return;
    try { localStorage.setItem(MODE_KEY, mode); } catch (e) {}
  }
  var stored = readModePreference();
  document.documentElement.setAttribute("data-mode", forced || stored || auto);

  var stage = null;
  var live = true;
  var current = "Default";
  var names = [];
  var slots = [];
  var ringOffset = 0;
  var ringTimer = 0;
  var framePaused = false;
  var C = window.Qevr.CROP;
  var ASPECT = C.w / C.h;
  var GAP = 3;
  var NAME_H = 20;
  var RING_MS = 2200;
  var motionQuery = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };

  /* Canonical codes stay untouched; these are display labels only. */
  var PT = {
    "Default": "NORMAL", "Happy": "FELIZ", "Eyes Closed": "DORMINDO",
    "Dead": "MORRI", "Joy": "FELIZ", "Anime": "ANIME", "Adoring": "ENCANTADO",
    "Laughing": "RISONHO", "Content": "CONTENTE", "Blissful": "EM PAZ", "Love": "IN LOVE",
    "Love Kissing": "BEIJINHOS", "Lovely": "SIMPÁTICO", "Naughty": "DANADINHO",
    "Kissing": "TE AMO", "Death": "MORTO (AGR DE VERDADE)", "Stars": "ESTRELINHAS",
    "Surprised": "SURPRESO", "Shocked": "GAG", "Sad": "TRISTE",
    "Unamused": "SEM GRAÇA", "Angry": "PUTO", "Bored": "ENTEDIADO"
  };

  function label(name) { return PT[name] || name.toUpperCase(); }
  function cssVar(name, fallback) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
  }
  function inkColor() { return cssVar("--qevr-ink", "#09090B"); }
  function brandColor() { return cssVar("--brand", "#CCFF00"); }
  function isPhone() { return window.matchMedia("(max-width: 720px)").matches; }

  function setCurrent(name) {
    current = name;
    document.getElementById("stageName").textContent = label(name);
    document.getElementById("stageCode").textContent = name.toUpperCase();
    [].forEach.call(document.querySelectorAll(".face"), function (face) {
      face.setAttribute("aria-pressed", String(face.getAttribute("data-name") === name));
    });
  }

  function setLive(on) {
    live = on;
    document.getElementById("ctlLive").setAttribute("aria-pressed", String(on));
    document.getElementById("ctlHold").setAttribute("aria-pressed", String(!on));
    if (!stage) return;
    if (on) {
      if (!stage._running) stage.start({ x: 18, y: 14 });
    } else {
      stage._running = false;
      stage.pos.x = 0;
      stage.pos.y = 0;
      stage.squash = 1;
      stage.applyTransform();
    }
  }

  /* Every chip is painted into an exact CROP-aspect box. */
  function paintChipBox(canvas, name, w) {
    var matrix = window.Qevr.matrix(name);
    if (!matrix) return;
    w = Math.max(8, Math.round(w));
    var h = Math.round(w / ASPECT);
    /* the frame holds 23 chips: dpr 2 is invisible at this size */
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    var body = brandColor();
    var ink = inkColor();
    var n = matrix.n;
    for (var gy = 0; gy < C.h; gy++) {
      var y0 = Math.round(gy * h / C.h);
      var y1 = Math.round((gy + 1) * h / C.h);
      for (var gx = 0; gx < C.w; gx++) {
        var value = matrix.cells[(gy + C.y0) * n + (gx + C.x0)];
        if (!value) continue;
        var x0 = Math.round(gx * w / C.w);
        var x1 = Math.round((gx + 1) * w / C.w);
        ctx.fillStyle = value === 2 ? ink : body;
        ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      }
    }
  }

  function makeSlot(ringIndex, wide) {
    var button = document.createElement("button");
    button.className = "face" + (wide ? " face--wide" : "");
    button.type = "button";
    button.setAttribute("data-ring", String(ringIndex));
    button.setAttribute("aria-pressed", "false");
    var art = document.createElement("span");
    art.className = "face__art";
    art.appendChild(document.createElement("canvas"));
    button.appendChild(art);
    var title = document.createElement("span");
    title.className = "face__name";
    button.appendChild(title);
    return button;
  }

  /* the 23 faces occupy the ring slots at (ring + offset) mod 23, so the
     whole deck drifts one seat clockwise per step and nothing ever repeats */
  function renderSlots() {
    if (!names.length) return;
    slots.forEach(function (slot) {
      var ring = parseInt(slot.getAttribute("data-ring"), 10);
      var name = names[(ring + ringOffset) % names.length];
      slot.setAttribute("data-name", name);
      slot.setAttribute("aria-label", label(name));
      slot.querySelector(".face__name").textContent = label(name);
      var art = slot.querySelector(".face__art");
      var w = Math.min(art.clientWidth, Math.round((art.clientHeight || 9999) * ASPECT));
      paintChipBox(slot.querySelector("canvas"), name, w);
      slot.setAttribute("aria-pressed", String(name === current));
    });
  }

  /* one single grid: strips of faces framing the plate. each strip fills its
     edge exactly; 23 is prime, so the counts differ per side on purpose. */
  function buildFrame() {
    var top = document.getElementById("stripTop");
    var left = document.getElementById("stripLeft");
    var right = document.getElementById("stripRight");
    var bottom = document.getElementById("stripBottom");
    [top, left, right, bottom].forEach(function (s) { s.innerHTML = ""; });
    slots = [];
    var frame = document.getElementById("frame");
    var W = frame.clientWidth || window.innerWidth;

    if (isPhone()) {
      /* the sketch read vertically: 3 faces, the playground, then rows of 3 */
      var artW = (W - 2 * GAP) / 3;
      var stripH = Math.round(artW / ASPECT + NAME_H);
      top.style.height = stripH + "px";
      left.style.width = right.style.width = "";
      for (var i = 0; i < 3; i++) {
        var s = makeSlot(i, false);
        top.appendChild(s); slots.push(s);
      }
      var wideH = Math.round(((W - GAP) / 2) / ASPECT + NAME_H);
      var rows = [];
      for (var r = 0; r < 6; r++) rows.push(stripH + "px");
      rows.push(wideH + "px");
      bottom.style.gridTemplateRows = rows.join(" ");
      for (var j = 0; j < 20; j++) {
        var wide = j >= 18;
        var b = makeSlot(3 + j, wide);
        bottom.appendChild(b); slots.push(b);
      }
    } else {
      var H = frame.clientHeight || Math.max(480, window.innerHeight - 52);
      var counts = { top: 8, right: 3, bottom: 8, left: 4 };
      var topArt = ((W - (counts.top - 1) * GAP) / counts.top) / ASPECT;
      var stripHd = Math.round(topArt + NAME_H);
      top.style.height = bottom.style.height = stripHd + "px";
      var hMid = H - 2 * stripHd - 2 * GAP;
      var leftW = Math.round((((hMid - (counts.left - 1) * GAP) / counts.left) - NAME_H) * ASPECT);
      var rightW = Math.round((((hMid - (counts.right - 1) * GAP) / counts.right) - NAME_H) * ASPECT);
      left.style.width = leftW + "px";
      right.style.width = rightW + "px";
      bottom.style.gridTemplateRows = "";
      /* ring order is clockwise: top L>R, right T>B, bottom R>L, left B>T */
      var k;
      for (k = 0; k < counts.top; k++) { var t = makeSlot(k, false); top.appendChild(t); slots.push(t); }
      for (k = 0; k < counts.right; k++) { var rr = makeSlot(counts.top + k, false); right.appendChild(rr); slots.push(rr); }
      for (k = 0; k < counts.bottom; k++) {
        var bb = makeSlot(counts.top + counts.right + (counts.bottom - 1 - k), false);
        bottom.appendChild(bb); slots.push(bb);
      }
      for (k = 0; k < counts.left; k++) {
        var ll = makeSlot(counts.top + counts.right + counts.bottom + (counts.left - 1 - k), false);
        left.appendChild(ll); slots.push(ll);
      }
    }
    renderSlots();
  }

  /* stepped drift, pausable, never under reduced motion */
  function stopRing() { if (ringTimer) { clearInterval(ringTimer); ringTimer = 0; } }
  function startRing() {
    stopRing();
    if (motionQuery.matches) return;
    ringTimer = setInterval(function () {
      if (framePaused || document.hidden) return;
      ringOffset = (ringOffset + 1) % 23;
      renderSlots();
    }, RING_MS);
  }

  function drawBarMark(canvas) {
    var matrix = window.QevrType.textMatrix(canvas.getAttribute("data-cells"));
    var fitMax = parseFloat(canvas.getAttribute("data-fit")) || 108;
    var room = canvas.parentElement.clientWidth || fitMax;
    var cell = Math.max(2, Math.floor(Math.min(room, fitMax) / matrix.w));
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = matrix.w * cell * dpr;
    canvas.height = matrix.h * cell * dpr;
    canvas.style.width = (matrix.w * cell) + "px";
    canvas.style.height = (matrix.h * cell) + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, matrix.w * cell, matrix.h * cell);
    ctx.fillStyle = brandColor();
    for (var y = 0; y < matrix.h; y++) {
      for (var x = 0; x < matrix.w; x++) {
        if (matrix.cells[y * matrix.w + x]) ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }
    canvas.setAttribute("role", "img");
    canvas.setAttribute("aria-label", canvas.getAttribute("data-cells"));
  }

  function fitStage() {
    if (!stage) return;
    var plate = document.querySelector(".plate");
    var pw = plate.clientWidth || window.innerWidth;
    var ph = plate.clientHeight || 320;
    var cell;
    if (isPhone()) cell = Math.min(10, Math.floor((pw - 32) / C.w));
    else cell = Math.floor(Math.min((ph - 24) / C.h, (pw * 0.46) / C.w));
    stage.setCell(Math.max(4, cell));
  }

  function syncColorControls() {
    var party = document.documentElement.getAttribute("data-mode") === "party";
    document.getElementById("ctlGreen").setAttribute("aria-pressed", String(!party));
    document.getElementById("ctlPink").setAttribute("aria-pressed", String(party));
  }

  function relayout(rebuild) {
    [].forEach.call(document.querySelectorAll("canvas[data-cells]"), drawBarMark);
    if (rebuild) buildFrame();
    else renderSlots();
    fitStage();
    if (stage) stage.paint();
  }

  function setColor(which) {
    var mode = which === "pink" || which === "party" ? "party" : "day";
    document.documentElement.setAttribute("data-mode", mode);
    writeModePreference(mode);
    syncColorControls();
    relayout(false);
  }

  syncColorControls();

  Promise.all([
    fetch("../assets/manifesto.pt.json").then(function (response) { return response.json(); }).catch(function () { return null; }),
    window.Qevr.load("../assets/qevr-expressions.json")
  ]).then(function (result) {
    var copy = result[0];
    names = result[1];
    if (copy && copy.studio) {
      var studioCopy = copy.studio;
      document.getElementById("faceLabel").textContent = studioCopy.faceLabel;
      document.getElementById("codeLabel").textContent = studioCopy.codeLabel;
      document.getElementById("moveLabel").textContent = studioCopy.moveLabel;
      document.getElementById("colorLabel").textContent = studioCopy.colorLabel;
      document.getElementById("glitchLabel").textContent = studioCopy.glitchLabel;
      document.getElementById("stageMeta").textContent = studioCopy.metaLines.join(" / ");
    }

    stage = new window.Qevr.Mascot(document.getElementById("stageCanvas"), {
      host: document.getElementById("stageBtn"), cell: 8, face: "Default"
    });
    setCurrent("Default");
    setLive(true);

    document.getElementById("stageBtn").addEventListener("click", function () {
      stage.poke().then(function () { setCurrent(stage.face.name); });
    });

    var frame = document.getElementById("frame");
    frame.addEventListener("click", function (event) {
      var face = event.target;
      while (face && face !== frame && !(face.classList && face.classList.contains("face"))) face = face.parentElement;
      if (!face || face === frame) return;
      var name = face.getAttribute("data-name");
      if (!name) return;
      setLive(false);
      stage.setFace(name);
      setCurrent(name);
    });
    /* a hand over the frame holds the ring still */
    frame.addEventListener("pointerenter", function () { framePaused = true; });
    frame.addEventListener("pointerleave", function () { framePaused = frame.contains(document.activeElement); });
    frame.addEventListener("focusin", function () { framePaused = true; });
    frame.addEventListener("focusout", function () {
      setTimeout(function () { framePaused = frame.contains(document.activeElement); }, 0);
    });

    window.QevrCascade.wireLinks(".bar__nav a, .bar__mark");
    document.getElementById("ctlLive").addEventListener("click", function () { setLive(true); });
    document.getElementById("ctlHold").addEventListener("click", function () { setLive(false); });
    document.getElementById("ctlGlitch").addEventListener("click", function () { stage.glitch(); });
    document.getElementById("ctlGreen").addEventListener("click", function () { setColor("green"); });
    document.getElementById("ctlPink").addEventListener("click", function () { setColor("pink"); });

    relayout(true);
    startRing();
    setTimeout(function () { relayout(true); }, 250);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { relayout(true); });

    setInterval(function () {
      if (live && stage && stage.face && stage.face.name !== current) setCurrent(stage.face.name);
    }, 400);

    var resizeTimer;
    window.addEventListener("resize", function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () { relayout(true); }, 150);
    });
  }).catch(function (error) { console.error("[studio] boot failed", error); });

  function syncMotionPreference() {
    if (motionQuery.matches) stopRing();
    else startRing();
  }
  if (motionQuery.addEventListener) motionQuery.addEventListener("change", syncMotionPreference);
  else if (motionQuery.addListener) motionQuery.addListener(syncMotionPreference);
})();
</script>
</body>
</html>
