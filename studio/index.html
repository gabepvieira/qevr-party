<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QEVR / O ESTÚDIO</title>
<meta name="description" content="AS 23 CARAS DO QEVR. UMA SÓ SILHUETA.">
<meta name="theme-color" content="#09090B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="studio.css">
</head>
<body>

<header class="bar">
  <a class="bar__mark" href="../" aria-label="QEVR"><canvas data-cells="QEVR" data-fit="108"></canvas></a>
  <nav class="bar__nav">
    <a href="../#manifesto">MANIFESTO</a>
    <a href="./" aria-current="page">O ESTÚDIO</a>
  </nav>
</header>

<div class="studio">
  <div class="studio__body">

    <section class="stage">
      <div class="stage__art">
        <button class="mascot" id="stageBtn" aria-label="QEVR"><canvas id="stageCanvas"></canvas></button>
      </div>
      <div class="stage__read">
        <div class="stage__label" id="faceLabel">OLHA A CARINHA DELE</div>
        <div class="stage__name" id="stageName">PADRÃO</div>
        <div class="stage__code"><span id="codeLabel">NO CÓDIGO</span> <b id="stageCode">DEFAULT</b></div>
      </div>
      <div class="stage__controls">
        <div class="ctlset">
          <div class="ctlset__label"><span class="lbl-long" id="moveLabel">ELE SE MEXE SOZINHO?</span><span class="lbl-short">SE MEXE?</span></div>
          <div class="ctlrow">
            <button class="ctl" id="ctlLive" aria-pressed="true">SIM</button>
            <button class="ctl" id="ctlHold" aria-pressed="false">NÃO</button>
          </div>
        </div>
        <div class="ctlset">
          <div class="ctlset__label"><span class="lbl-long" id="colorLabel">MUDE A COR DO QEVR</span><span class="lbl-short">COR</span></div>
          <div class="ctlrow">
            <button class="ctl ctl--swatch ctl--green" id="ctlGreen" aria-pressed="true"><i></i><span>VERDE</span></button>
            <button class="ctl ctl--swatch ctl--pink" id="ctlPink" aria-pressed="false"><i></i><span>ROSA</span></button>
          </div>
        </div>
        <div class="ctlset">
          <div class="ctlset__label"><span class="lbl-long" id="glitchLabel">CLIQUE AQUI</span><span class="lbl-short">DEFEITO</span></div>
          <div class="ctlrow"><button class="ctl" id="ctlGlitch">GLITCH</button></div>
        </div>
      </div>
    </section>

    <section class="faces">
      <div class="faces__grid" id="facesGrid"></div>
    </section>

  </div>
</div>

<script src="../assets/pixelfont.js"></script>
<script src="../assets/qevr.js"></script>
<script src="../assets/cascade.js"></script>
<script>
(function () {
  "use strict";

  var TIME_AWARE = false;
  var hh = new Date().getHours();
  var auto = TIME_AWARE ? ((hh >= 23 || hh < 7) ? "party" : (hh === 7 ? "dawn" : "day")) : "day";
  var forced = (location.search.match(/[?&]mode=(day|party|dawn)/) || [])[1];
  document.documentElement.setAttribute("data-mode", forced || auto);

  var stage, live = true, current = "Default";

  /* Portuguese labels. The names in qevr-expressions.json are canonical and never
     renamed, because the app maps behaviours to them. This is a label, not a rename. */
  var PT = {
    "Default": "PADRÃO", "Happy": "FELIZ", "Eyes Closed": "OLHOS FECHADOS",
    "Dead": "MORTO", "Joy": "ALEGRIA", "Anime": "ANIME", "Adoring": "ENCANTADO",
    "Laughing": "RINDO", "Content": "CONTENTE", "Blissful": "EM PAZ", "Love": "AMOR",
    "Love Kissing": "BEIJO DE AMOR", "Lovely": "AMOROSO", "Naughty": "SAFADO",
    "Kissing": "BEIJANDO", "Death": "MORTE", "Stars": "ESTRELAS",
    "Surprised": "SURPRESO", "Shocked": "CHOCADO", "Sad": "TRISTE",
    "Unamused": "SEM GRAÇA", "Angry": "BRAVO", "Bored": "ENTEDIADO"
  };
  function label(n) { return PT[n] || n.toUpperCase(); }
  function inkColor() { return getComputedStyle(document.documentElement).getPropertyValue("--qevr-ink").trim() || "#09090B"; }
  function brandColor() { return getComputedStyle(document.documentElement).getPropertyValue("--brand").trim() || "#CCFF00"; }

  function diffCount(a, b) {
    var A = window.Qevr.matrix(a), B = window.Qevr.matrix(b);
    if (!A || !B) return 0;
    var n = 0;
    for (var i = 0; i < A.cells.length; i++) if (A.cells[i] !== B.cells[i]) n++;
    return n;
  }

  function setCurrent(name) {
    current = name;
    document.getElementById("stageName").textContent = label(name);
    document.getElementById("stageCode").textContent = name.toUpperCase();
    [].forEach.call(document.querySelectorAll(".face"), function (f) {
      f.setAttribute("aria-pressed", String(f.getAttribute("data-name") === name));
    });
  }

  function setLive(on) {
    live = on;
    document.getElementById("ctlLive").setAttribute("aria-pressed", String(on));
    document.getElementById("ctlHold").setAttribute("aria-pressed", String(!on));
    if (!stage) return;
    if (on) stage.start({ x: 18, y: 14 });
    else { stage._running = false; stage.pos.x = 0; stage.pos.y = 0; stage.squash = 1; stage.applyTransform(); }
  }

  /* He is drawn only in columns 6..28 and rows 5..29 of the 34x34 grid, so
     rendering the full grid renders a black margin as wide as he is. Crop to
     the real bounds and fill the box exactly, with rounded cell boundaries so
     runs never gap, and the same scale on both axes so there is no shear. */
  var C = window.Qevr.CROP;
  var ASPECT = C.w / C.h;

  function paintChipBox(canvas, name, w, h) {
    var m = window.Qevr.matrix(name);
    if (!m) return;
    w = Math.max(8, Math.round(w)); h = Math.max(8, Math.round(h));
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    var body = brandColor(), ink = inkColor(), n = m.n;
    for (var gy = 0; gy < C.h; gy++) {
      var y0 = Math.round(gy * h / C.h), y1 = Math.round((gy + 1) * h / C.h);
      for (var gx = 0; gx < C.w; gx++) {
        var v = m.cells[(gy + C.y0) * n + (gx + C.x0)];
        if (!v) continue;
        var x0 = Math.round(gx * w / C.w), x1 = Math.round((gx + 1) * w / C.w);
        ctx.fillStyle = v === 2 ? ink : body;
        ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      }
    }
  }

  /* 24 cells exactly. The cell is sized to him, and the stage column takes
     whatever width is left, so there is no black inside any cell. */
  var COLS = [4, 6, 8];
  function layoutFaces() {
    var bodyEl = document.querySelector(".studio__body");
    var grid = document.getElementById("facesGrid");
    var totalW = bodyEl.clientWidth, ph = bodyEl.clientHeight;
    if (!totalW || !ph) return;
    var nameH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--faceName")) || 15;
    var phone = window.matchMedia("(max-width: 860px)").matches;
    var mw, mh, cols;

    if (phone) {
      cols = 3;
      var panel = grid.parentElement.clientWidth || totalW;
      mw = Math.floor(panel / cols) - 1;
      mh = Math.round(mw / ASPECT);
      bodyEl.style.gridTemplateColumns = "";
    } else {
      var best = null;
      COLS.forEach(function (c) {
        var rows = Math.ceil(24 / c);
        var rowH = Math.floor(ph / rows);
        var hh = rowH - nameH - 3;
        if (hh < 50) return;
        var ww = Math.round(hh * ASPECT);
        var panelW = c * (ww + 1) + 2;
        var stageW = totalW - panelW;
        if (stageW < 250 || stageW > totalW * 0.45) return;
        if (!best || ww > best.ww) best = { c: c, ww: ww, hh: hh, stageW: stageW };
      });
      if (best) {
        cols = best.c; mw = best.ww; mh = best.hh;
        bodyEl.style.gridTemplateColumns = best.stageW + "px minmax(0, 1fr)";
      } else {
        cols = 6;
        bodyEl.style.gridTemplateColumns = "";
        var pw = grid.parentElement.clientWidth || totalW;
        var rowH2 = Math.floor(ph / 4);
        mh = rowH2 - nameH - 3;
        mw = Math.min(Math.floor(pw / cols) - 1, Math.round(mh * ASPECT));
        mh = Math.round(mw / ASPECT);
      }
    }

    grid.style.gridTemplateColumns = "repeat(" + cols + ", minmax(0, 1fr))";
    grid.style.gridAutoRows = (mh + nameH + 3) + "px";
    [].forEach.call(document.querySelectorAll(".face"), function (f) {
      paintChipBox(f.querySelector("canvas"), f.getAttribute("data-name"), mw, mh);
    });
  }

  function fitStage() {
    if (!stage) return;
    var st = document.querySelector(".stage");
    var cs = getComputedStyle(st);
    var availW = st.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    /* measure the column, never the art box: the art box is sized by him, so
       measuring it would feed back on itself and shrink him every relayout */
    var phone = window.matchMedia("(max-width: 860px)").matches;
    var availH = phone ? document.querySelector(".stage__art").clientHeight : (availW / ASPECT);
    var cell = Math.max(2, Math.floor(Math.min(availW / C.w, availH / C.h)));
    stage.setCell(cell);
  }

  function drawBarMark(canvas) {
    var m = window.QevrType.textMatrix(canvas.getAttribute("data-cells"));
    var fitMax = parseFloat(canvas.getAttribute("data-fit")) || 108;
    var cell = Math.max(2, Math.floor(Math.min(canvas.parentElement.clientWidth || fitMax, fitMax) / m.w));
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = m.w * cell * dpr; canvas.height = m.h * cell * dpr;
    canvas.style.width = (m.w * cell) + "px"; canvas.style.height = (m.h * cell) + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, m.w * cell, m.h * cell);
    ctx.fillStyle = brandColor();
    for (var y = 0; y < m.h; y++) for (var x = 0; x < m.w; x++) if (m.cells[y * m.w + x]) ctx.fillRect(x * cell, y * cell, cell, cell);
    canvas.setAttribute("role", "img");
    canvas.setAttribute("aria-label", canvas.getAttribute("data-cells"));
  }

  function relayout() {
    [].forEach.call(document.querySelectorAll("canvas[data-cells]"), drawBarMark);
    layoutFaces();
    fitStage();
    if (stage) stage.paint();
  }

  function setColor(which) {
    document.documentElement.setAttribute("data-mode", which === "pink" ? "party" : "day");
    document.getElementById("ctlGreen").setAttribute("aria-pressed", String(which !== "pink"));
    document.getElementById("ctlPink").setAttribute("aria-pressed", String(which === "pink"));
    relayout();
  }

  Promise.all([
    fetch("../assets/manifesto.pt.json").then(function (r) { return r.json(); }).catch(function () { return null; }),
    window.Qevr.load("../assets/qevr-expressions.json")
  ]).then(function (res) {
    var COPY = res[0], names = res[1];
    if (COPY && COPY.studio) {
      var s = COPY.studio;
      document.getElementById("faceLabel").textContent = s.faceLabel;
      document.getElementById("codeLabel").textContent = s.codeLabel;
      document.getElementById("moveLabel").textContent = s.moveLabel;
      document.getElementById("colorLabel").textContent = s.colorLabel;
      document.getElementById("glitchLabel").textContent = s.glitchLabel;
    }

    stage = new window.Qevr.Mascot(document.getElementById("stageCanvas"), {
      host: document.getElementById("stageBtn"), cell: 6, face: "Default"
    });
    setCurrent("Default");
    setLive(true);

    document.getElementById("stageBtn").addEventListener("click", function () {
      stage.poke().then(function () { setCurrent(stage.face.name); });
    });

    var grid = document.getElementById("facesGrid");
    names.forEach(function (name) {
      var b = document.createElement("button");
      b.className = "face"; b.type = "button";
      b.setAttribute("data-name", name);
      b.setAttribute("aria-pressed", String(name === "Default"));
      var art = document.createElement("span");
      art.className = "face__art";
      art.appendChild(document.createElement("canvas"));
      b.appendChild(art);
      var t = document.createElement("span");
      t.className = "face__name"; t.textContent = label(name);
      b.appendChild(t);
      b.addEventListener("click", function () {
        setLive(false);
        stage.setFace(name);
        setCurrent(name);
      });
      grid.appendChild(b);
    });

    var meta = document.createElement("div");
    meta.className = "facemeta";
    var mt = document.createElement("div");
    mt.className = "facemeta__t";
    mt.textContent = (COPY && COPY.studio && COPY.studio.metaTitle) || "A REGRA DELE";
    meta.appendChild(mt);
    var lines = (COPY && COPY.studio && COPY.studio.metaLines) || ["GRADE 34 X 34", "23 CARAS", "SÓ O ROSTO MUDA"];
    lines.forEach(function (t) {
      var l = document.createElement("div");
      l.className = "facemeta__l";
      l.textContent = t;
      meta.appendChild(l);
    });
    grid.appendChild(meta);

    window.QevrCascade.wireLinks(".bar__nav a, .bar__mark");

    document.getElementById("ctlLive").addEventListener("click", function () { setLive(true); });
    document.getElementById("ctlHold").addEventListener("click", function () { setLive(false); });
    document.getElementById("ctlGlitch").addEventListener("click", function () { stage.glitch(); });
    document.getElementById("ctlGreen").addEventListener("click", function () { setColor("green"); });
    document.getElementById("ctlPink").addEventListener("click", function () { setColor("pink"); });

    relayout();
    /* fonts settle after first paint and change the row heights */
    setTimeout(relayout, 250);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);

    setInterval(function () {
      if (live && stage && stage.face && stage.face.name !== current) setCurrent(stage.face.name);
    }, 400);

    var rt;
    window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(relayout, 150); });
  }).catch(function (e) { console.error("[studio] boot failed", e); });
})();
</script>
</body>
</html>
