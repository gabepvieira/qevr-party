<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QEVR / O ESTÚDIO</title>
<meta name="description" content="AS 23 CARAS DO QEVR. UMA SÓ SILHUETA.">
<meta name="theme-color" content="#09090B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="studio.css">
</head>
<body>

<header class="bar">
  <div class="bar__in">
    <a class="bar__mark" href="../" aria-label="QEVR"><canvas data-cells="QEVR" data-fit="108"></canvas></a>
    <nav class="bar__nav">
      <a href="../#manifesto">O MANIFESTO</a>
      <a href="./" aria-current="page">O ESTÚDIO</a>
    </nav>
  </div>
</header>

<main class="studio">
  <div class="frame" id="frame">
    <div class="lane" id="lane"></div>
    <div class="strip strip--top" id="stripTop"></div>

    <section class="plate" aria-labelledby="stageName">
      <div class="stage__art">
        <button class="mascot" id="stageBtn" aria-label="QEVR"><canvas id="stageCanvas"></canvas></button>
      </div>
      <div class="plate__panel">
        <div class="stage__read">
          <div class="stage__label" id="faceLabel">OLHA A CARINHA DELE</div>
          <div class="stage__name" id="stageName">NORMAL</div>
          <div class="stage__code"><span id="codeLabel">NO CÓDIGO</span> <b id="stageCode">DEFAULT</b></div>
        </div>
        <div class="stage__controls">
          <div class="ctlset">
            <div class="ctlset__label"><span class="lbl-long" id="moveLabel">ELE SE MEXE SOZINHO?</span><span class="lbl-short" id="moveLabelShort">SE MEXE?</span></div>
            <div class="ctlrow">
              <button class="ctl" id="ctlLive" type="button" aria-pressed="true">SIM</button>
              <button class="ctl" id="ctlHold" type="button" aria-pressed="false">NÃO</button>
            </div>
          </div>
          <div class="ctlset">
            <div class="ctlset__label"><span class="lbl-long" id="colorLabel">MUDE A COR DO QEVR</span><span class="lbl-short" id="colorLabelShort">COR</span></div>
            <div class="ctlrow">
              <button class="ctl ctl--swatch ctl--green" id="ctlGreen" type="button" aria-pressed="true"><i></i><span>VERDE</span></button>
              <button class="ctl ctl--swatch ctl--pink" id="ctlPink" type="button" aria-pressed="false"><i></i><span>ROSA</span></button>
            </div>
          </div>
          <div class="ctlset ctlset--glitch">
            <div class="ctlset__label"><span class="lbl-long" id="glitchLabel">CLIQUE AQUI</span><span class="lbl-short" id="glitchLabelShort">CLIQUE AQUI</span></div>
            <div class="ctlrow"><button class="ctl" id="ctlGlitch" type="button">GLITCH</button></div>
          </div>
        </div>
        <div class="stage__meta"><span class="stage__meta-title" id="stageMetaTitle"></span><span id="stageMetaLines"></span></div>
      </div>
    </section>

    <div class="strip strip--bottom" id="stripBottom"></div>
  </div>
</main>

<script src="../assets/pixelfont.js"></script>
<script src="../assets/qevr.js"></script>
<script src="../assets/cascade.js"></script>
<script>
(function () {
  "use strict";

  var MODE_KEY = "qevr.mode";
  var TIME_AWARE = false;
  var hh = new Date().getHours();
  var auto = TIME_AWARE ? ((hh >= 23 || hh < 7) ? "party" : (hh === 7 ? "dawn" : "day")) : "day";
  var forced = (location.search.match(/[?&]mode=(day|party|dawn)(?:&|$)/) || [])[1];
  function readModePreference() {
    try {
      var mode = localStorage.getItem(MODE_KEY);
      return mode === "day" || mode === "party" ? mode : null;
    } catch (e) { return null; }
  }
  function writeModePreference(mode) {
    if (mode !== "day" && mode !== "party") return;
    try { localStorage.setItem(MODE_KEY, mode); } catch (e) {}
  }
  var stored = readModePreference();
  document.documentElement.setAttribute("data-mode", forced || stored || auto);

  var stage = null;
  var live = true;
  var current = "Default";
  var names = [];
  var chips = [];
  var framePaused = false;
  var C = window.Qevr.CROP;
  var ASPECT = C.w / C.h;
  var GAP = 3;
  var NAME_H = 20;
  /* the deck crawls, it never teleports: a slow conveyor, held still by a hand */
  var LANE_SPEED = 12;      /* px per second, desktop loop */
  var STRIP_SPEED = 10;     /* px per second, phone strips */
  var TICK_MS = 80;
  var lane = { L: 0, D: 0, S: 0, cellH: 0, W: 0, H: 0, phase: 0 };
  var phoneMounted = null;  /* which layout the chips are mounted in */
  var motionQuery = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };

  /* Canonical codes stay untouched; these are display labels only. */
  var PT = {
    "Default": "NORMAL", "Happy": "FELIZ", "Eyes Closed": "DORMINDO",
    "Dead": "MORRI", "Joy": "ALEGRIA", "Anime": "ANIME", "Adoring": "ENCANTADO",
    "Laughing": "RISONHO", "Content": "CONTENTE", "Blissful": "EM PAZ", "Love": "IN LOVE",
    "Love Kissing": "BEIJINHOS", "Lovely": "SIMPÁTICO", "Naughty": "DANADINHO",
    "Kissing": "TE AMO", "Death": "MORTO (AGR DE VERDADE)", "Stars": "ESTRELINHAS",
    "Surprised": "SURPRESO", "Shocked": "GAG", "Sad": "TRISTE",
    "Unamused": "SEM GRAÇA", "Angry": "PUTO", "Bored": "ENTEDIADO"
  };

  function label(name) { return PT[name] || name.toUpperCase(); }
  function cssVar(name, fallback) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
  }
  function inkColor() { return cssVar("--qevr-ink", "#09090B"); }
  function brandColor() { return cssVar("--brand", "#CCFF00"); }
  function isPhone() { return window.matchMedia("(max-width: 720px)").matches; }

  function setCurrent(name) {
    current = name;
    document.getElementById("stageName").textContent = label(name);
    document.getElementById("stageCode").textContent = name.toUpperCase();
    [].forEach.call(document.querySelectorAll(".face"), function (face) {
      face.setAttribute("aria-pressed", String(face.getAttribute("data-name") === name));
    });
  }

  function setLive(on) {
    live = on;
    document.getElementById("ctlLive").setAttribute("aria-pressed", String(on));
    document.getElementById("ctlHold").setAttribute("aria-pressed", String(!on));
    if (!stage) return;
    if (on) {
      if (!stage._running) stage.start({ x: 18, y: 14 });
    } else {
      stage._running = false;
      stage.pos.x = 0;
      stage.pos.y = 0;
      stage.squash = 1;
      stage.applyTransform();
    }
  }

  /* Every chip is painted into an exact CROP-aspect box. */
  function paintChipBox(canvas, name, w) {
    var matrix = window.Qevr.matrix(name);
    if (!matrix) return;
    w = Math.max(8, Math.round(w));
    var h = Math.round(w / ASPECT);
    /* the frame holds 23 chips: dpr 2 is invisible at this size */
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    var body = brandColor();
    var ink = inkColor();
    var n = matrix.n;
    for (var gy = 0; gy < C.h; gy++) {
      var y0 = Math.round(gy * h / C.h);
      var y1 = Math.round((gy + 1) * h / C.h);
      for (var gx = 0; gx < C.w; gx++) {
        var value = matrix.cells[(gy + C.y0) * n + (gx + C.x0)];
        if (!value) continue;
        var x0 = Math.round(gx * w / C.w);
        var x1 = Math.round((gx + 1) * w / C.w);
        ctx.fillStyle = value === 2 ? ink : body;
        ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      }
    }
  }

  function makeChip(name) {
    var button = document.createElement("button");
    button.className = "face";
    button.type = "button";
    button.setAttribute("data-name", name);
    button.setAttribute("aria-pressed", "false");
    button.setAttribute("aria-label", label(name));
    var art = document.createElement("span");
    art.className = "face__art";
    art.appendChild(document.createElement("canvas"));
    button.appendChild(art);
    var title = document.createElement("span");
    title.className = "face__name";
    title.textContent = label(name);
    button.appendChild(title);
    return button;
  }

  function makeChips() {
    chips = names.map(function (name) { return { name: name, el: makeChip(name) }; });
  }

  function paintChips(w) {
    chips.forEach(function (chip) {
      paintChipBox(chip.el.querySelector("canvas"), chip.name, w);
      chip.el.style.width = Math.round(w) + "px";
    });
  }

  /* ---------- desktop: one circulation around the frame.
     All 23 faces, all the same size, crawling clockwise. The top and bottom
     belts run like the phone strips: chips enter from OUTSIDE the window and
     leave the same way. The side belts run the full height and render BEHIND
     the horizontal belts, so a side chip emerges from behind the top row and
     slides down behind the bottom one. Every wrap between belts happens fully
     off-screen — nothing ever pops in view. The chip size is solved so the 23
     cells pack the loop tight; a bigger screen just means bigger faces. */

  function laneCellH(S) { return S / ASPECT + NAME_H; }

  function solveChipSize(W, H) {
    /* largest S whose 23 vertical-pitch cells still fit the loop, capped so
       the plate keeps enough height to breathe */
    var best = 80;
    for (var s = 80; s <= 640; s += 2) {
      var cellH = laneCellH(s);
      if (H - 2 * (cellH + GAP) < 300) break;
      var L = 2 * (W + s) + 2 * (H + cellH);
      if (23 * (cellH + GAP) <= L) best = s; else break;
    }
    return best;
  }

  function lanePoint(d) {
    var hw = lane.W + lane.S;      /* horizontal run length */
    var vv = lane.H + lane.cellH;  /* vertical run length   */
    if (d < hw) return { x: d - lane.S, y: 0, front: true };                 /* top, left>right */
    d -= hw;
    if (d < vv) return { x: lane.W - lane.S, y: d - lane.cellH };            /* right, down, behind */
    d -= vv;
    if (d < hw) return { x: lane.W - d, y: lane.H - lane.cellH, front: true }; /* bottom, right>left */
    d -= hw;
    return { x: 0, y: lane.H - d };                                          /* left, up, behind */
  }

  function placeChips() {
    for (var i = 0; i < chips.length; i++) {
      var p = lanePoint((i * lane.D + lane.phase) % lane.L);
      var el = chips[i].el;
      el.style.zIndex = p.front ? "2" : "1";
      el.style.transform = "translate(" + Math.round(p.x) + "px," + Math.round(p.y) + "px)";
    }
  }

  function buildFrame() {
    var frame = document.getElementById("frame");
    var laneHost = document.getElementById("lane");
    var top = document.getElementById("stripTop");
    var bottom = document.getElementById("stripBottom");
    if (!chips.length) return;

    if (isPhone()) {
      if (phoneMounted !== true) {
        laneHost.innerHTML = ""; top.innerHTML = ""; bottom.innerHTML = "";
        chips.forEach(function (chip, i) {
          chip.el.style.transform = "";
          chip.el.style.visibility = "";
          (i < 12 ? top : bottom).appendChild(chip.el);
        });
        phoneMounted = true;
      }
      var W = frame.clientWidth || window.innerWidth;
      var artW = Math.max(84, Math.min(120, W / 3.4));
      var stripH = Math.round(artW / ASPECT + NAME_H);
      document.documentElement.style.setProperty("--chip-w", Math.round(artW) + "px");
      document.documentElement.style.setProperty("--strip-h", stripH + "px");
      paintChips(artW);
    } else {
      if (phoneMounted !== false) {
        laneHost.innerHTML = ""; top.innerHTML = ""; bottom.innerHTML = "";
        chips.forEach(function (chip) { laneHost.appendChild(chip.el); });
        phoneMounted = false;
      }
      var fw = frame.clientWidth || window.innerWidth;
      var fh = frame.clientHeight || Math.max(480, window.innerHeight - 52);
      var frac = lane.L ? lane.phase / lane.L : 0;
      lane.S = solveChipSize(fw, fh);
      lane.cellH = laneCellH(lane.S);
      lane.W = fw; lane.H = fh;
      lane.L = 2 * (fw + lane.S) + 2 * (fh + lane.cellH);
      lane.D = lane.L / 23;
      lane.phase = frac * lane.L;
      document.documentElement.style.setProperty("--band-w", Math.round(lane.S + GAP) + "px");
      document.documentElement.style.setProperty("--band-h", Math.round(lane.cellH + GAP) + "px");
      paintChips(lane.S);
      placeChips();
    }
  }

  /* ---------- motion: slow, pausable, off under reduced motion ---------- */

  var laneTimer = 0;
  var stripHold = 0;
  var stripDir = { top: 1, bottom: -1 };
  function stopLane() { if (laneTimer) { clearInterval(laneTimer); laneTimer = 0; } }
  function startLane() {
    stopLane();
    if (motionQuery.matches) return;
    var last = Date.now();
    laneTimer = setInterval(function () {
      var now = Date.now();
      var dt = Math.min(0.5, (now - last) / 1000);
      last = now;
      if (document.hidden) return;
      if (isPhone()) {
        if (stripHold && now - stripHold < 2500) return;
        stripHold = 0;
        ["top", "bottom"].forEach(function (key) {
          var el = document.getElementById(key === "top" ? "stripTop" : "stripBottom");
          if (!el || el.scrollWidth <= el.clientWidth) return;
          el.scrollLeft += stripDir[key] * STRIP_SPEED * dt;
          var max = el.scrollWidth - el.clientWidth;
          if (el.scrollLeft >= max - 1) stripDir[key] = -1;
          if (el.scrollLeft <= 1) stripDir[key] = 1;
        });
      } else {
        if (framePaused) return;
        lane.phase = (lane.phase + LANE_SPEED * dt) % lane.L;
        placeChips();
      }
    }, TICK_MS);
  }

  function drawBarMark(canvas) {
    var matrix = window.QevrType.textMatrix(canvas.getAttribute("data-cells"));
    var fitMax = parseFloat(canvas.getAttribute("data-fit")) || 108;
    var room = canvas.parentElement.clientWidth || fitMax;
    var cell = Math.max(2, Math.floor(Math.min(room, fitMax) / matrix.w));
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = matrix.w * cell * dpr;
    canvas.height = matrix.h * cell * dpr;
    canvas.style.width = (matrix.w * cell) + "px";
    canvas.style.height = (matrix.h * cell) + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, matrix.w * cell, matrix.h * cell);
    ctx.fillStyle = brandColor();
    for (var y = 0; y < matrix.h; y++) {
      for (var x = 0; x < matrix.w; x++) {
        if (matrix.cells[y * matrix.w + x]) ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }
    canvas.setAttribute("role", "img");
    canvas.setAttribute("aria-label", canvas.getAttribute("data-cells"));
  }

  function fitStage() {
    if (!stage) return;
    var plate = document.querySelector(".plate");
    var pw = plate.clientWidth || window.innerWidth;
    var ph = plate.clientHeight || 320;
    var cell;
    if (isPhone()) {
      /* no scroll on a phone: he shares the plate with his panel, so he fits it */
      var panel = plate.querySelector(".plate__panel");
      var free = ph - (panel ? panel.offsetHeight : 210) - 30;
      cell = Math.min(10, Math.floor((pw - 32) / C.w), Math.floor(free / C.h));
    } else {
      cell = Math.floor(Math.min((ph - 24) / C.h, (pw * 0.46) / C.w));
    }
    stage.setCell(Math.max(4, cell));
  }

  function syncColorControls() {
    var party = document.documentElement.getAttribute("data-mode") === "party";
    document.getElementById("ctlGreen").setAttribute("aria-pressed", String(!party));
    document.getElementById("ctlPink").setAttribute("aria-pressed", String(party));
  }

  function relayout() {
    [].forEach.call(document.querySelectorAll("canvas[data-cells]"), drawBarMark);
    buildFrame();
    fitStage();
    if (stage) stage.paint();
  }

  /* picking a colour is a room change: same QR cascade as walking through a door */
  function setColor(which) {
    var mode = which === "pink" || which === "party" ? "party" : "day";
    if (document.documentElement.getAttribute("data-mode") === mode) return;
    window.QevrCascade.through(function () {
      document.documentElement.setAttribute("data-mode", mode);
      writeModePreference(mode);
      syncColorControls();
      relayout();
    });
  }

  syncColorControls();

  Promise.all([
    fetch("../assets/manifesto.pt.json").then(function (response) { return response.json(); }).catch(function () { return null; }),
    window.Qevr.load("../assets/qevr-expressions.json")
  ]).then(function (result) {
    var copy = result[0];
    names = result[1];
    if (copy && copy.studio) {
      var studioCopy = copy.studio;
      document.getElementById("faceLabel").textContent = studioCopy.faceLabel;
      document.getElementById("codeLabel").textContent = studioCopy.codeLabel;
      document.getElementById("moveLabel").textContent = studioCopy.moveLabel;
      document.getElementById("moveLabelShort").textContent = studioCopy.moveLabelShort || studioCopy.moveLabel;
      document.getElementById("colorLabel").textContent = studioCopy.colorLabel;
      document.getElementById("colorLabelShort").textContent = studioCopy.colorLabelShort || studioCopy.colorLabel;
      document.getElementById("glitchLabel").textContent = studioCopy.glitchLabel;
      document.getElementById("glitchLabelShort").textContent = studioCopy.glitchLabel;
      document.getElementById("stageMetaTitle").textContent = studioCopy.metaTitle || "";
      document.getElementById("stageMetaLines").textContent = studioCopy.metaLines.join(" / ");
    }
    if (copy && copy.doors) {
      [].forEach.call(document.querySelectorAll(".bar__nav a"), function (a, i) {
        a.textContent = i === 0 ? copy.doors.manifesto.label : copy.doors.studio.label;
      });
    }

    stage = new window.Qevr.Mascot(document.getElementById("stageCanvas"), {
      host: document.getElementById("stageBtn"), cell: 8, face: "Default"
    });
    setCurrent("Default");
    setLive(true);

    document.getElementById("stageBtn").addEventListener("click", function () {
      stage.poke().then(function () { setCurrent(stage.face.name); });
    });

    var frame = document.getElementById("frame");
    frame.addEventListener("click", function (event) {
      var face = event.target;
      while (face && face !== frame && !(face.classList && face.classList.contains("face"))) face = face.parentElement;
      if (!face || face === frame) return;
      var name = face.getAttribute("data-name");
      if (!name) return;
      setLive(false);
      stage.setFace(name);
      setCurrent(name);
    });
    /* a hand over the frame holds the ring still */
    frame.addEventListener("pointerenter", function () { framePaused = true; });
    frame.addEventListener("pointerleave", function () { framePaused = frame.contains(document.activeElement); });
    frame.addEventListener("focusin", function () { framePaused = true; });
    frame.addEventListener("focusout", function () {
      setTimeout(function () { framePaused = frame.contains(document.activeElement); }, 0);
    });

    window.QevrCascade.wireLinks(".bar__nav a, .bar__mark");
    document.getElementById("ctlLive").addEventListener("click", function () { setLive(true); });
    document.getElementById("ctlHold").addEventListener("click", function () { setLive(false); });
    document.getElementById("ctlGlitch").addEventListener("click", function () { stage.glitch(); });
    document.getElementById("ctlGreen").addEventListener("click", function () { setColor("green"); });
    document.getElementById("ctlPink").addEventListener("click", function () { setColor("pink"); });

    makeChips();
    relayout();
    startLane();
    setTimeout(relayout, 250);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);

    /* a finger on a strip owns it; the crawl resumes a beat after it lets go */
    ["stripTop", "stripBottom"].forEach(function (id) {
      var el = document.getElementById(id);
      el.addEventListener("pointerdown", function () { stripHold = Date.now(); }, { passive: true });
      el.addEventListener("wheel", function () { stripHold = Date.now(); }, { passive: true });
      el.addEventListener("touchmove", function () { stripHold = Date.now(); }, { passive: true });
    });

    setInterval(function () {
      if (live && stage && stage.face && stage.face.name !== current) setCurrent(stage.face.name);
    }, 400);

    var resizeTimer;
    window.addEventListener("resize", function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(relayout, 150);
    });
  }).catch(function (error) { console.error("[studio] boot failed", error); });

  function syncMotionPreference() {
    if (motionQuery.matches) stopLane();
    else startLane();
  }
  if (motionQuery.addEventListener) motionQuery.addEventListener("change", syncMotionPreference);
  else if (motionQuery.addListener) motionQuery.addListener(syncMotionPreference);
})();
</script>
</body>
</html>
